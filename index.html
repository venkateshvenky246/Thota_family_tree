<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Thota Family Tree · థోటా వంశ వృక్షం</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;1,400&family=Noto+Serif+Telugu:wght@300;400;500;600&family=Noto+Serif:wght@300;400&display=swap" rel="stylesheet">
<style>
/* ================================================================
   RESET & CSS VARIABLES
================================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --saffron:#FF9933;--saffron-lt:#FFB566;--saffron-dk:#CC6600;
  --gold:#D4AF37;--gold-lt:#F0D060;--gold-dk:#A07820;
  --maroon:#800020;--maroon-lt:#A0304A;--maroon-dk:#500010;
  --green-dk:#1B4332;--green:#2D6A4F;
  --cream:#FDF6E3;--cream-dk:#F5E8C0;
  --ink:#1A0800;--ink-lt:#3D1A00;--muted:#7A5C3A;
  --node-bg:rgba(253,246,227,0.97);
  --node-border:#C8921A;
  --shadow-warm:rgba(180,100,0,0.18);
  --glow-you:rgba(255,153,51,0.65);
  --path-color:#FFD700;
  --search-glow:rgba(255,215,0,0.8);
  --dim-opacity:0.18;
  --transition-speed:0.25s;
}

html,body{width:100%;min-height:100vh;background:var(--ink);color:var(--ink);
  font-family:'Crimson Pro',Georgia,serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent}

/* ── TELUGU MODE ── */
body.lang-te .header h1,body.lang-te .btn,body.lang-te .node-rel,
body.lang-te .modal h2,body.lang-te .fgrp label,body.lang-te .modal p,
body.lang-te .header-sub,body.lang-te .you-bar,body.lang-te .leg-item,
body.lang-te .hint-bar,body.lang-te .search-wrap input,
body.lang-te .timeline-text{font-family:'Noto Serif Telugu',serif}
body.lang-te .node-rel{font-size:0.58rem;letter-spacing:0}
body.lang-te .btn{letter-spacing:0.01em}

/* ================================================================
   BACKGROUND — Mandala / Rangoli
================================================================ */
.bg-layer{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:radial-gradient(ellipse at 50% 0%,rgba(212,175,55,0.18) 0%,transparent 60%),
  radial-gradient(ellipse at 0% 100%,rgba(128,0,32,0.2) 0%,transparent 50%),
  radial-gradient(ellipse at 100% 100%,rgba(255,153,51,0.12) 0%,transparent 50%),#1A0800}
.bg-layer::before{content:'';position:absolute;inset:0;
  background-image:
    repeating-linear-gradient(0deg,rgba(212,175,55,0.035) 0,transparent 1px,transparent 44px,rgba(212,175,55,0.035) 45px),
    repeating-linear-gradient(90deg,rgba(212,175,55,0.035) 0,transparent 1px,transparent 44px,rgba(212,175,55,0.035) 45px)}
/* Animated mandala rings */
.bg-layer::after{content:'';position:absolute;width:1000px;height:1000px;top:50%;left:50%;
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:
    radial-gradient(circle at 50% 50%,
      transparent 30%,rgba(212,175,55,0.055) 31%,transparent 32%,
      transparent 38%,rgba(212,175,55,0.045) 39%,transparent 40%,
      transparent 46%,rgba(212,175,55,0.035) 47%,transparent 48%,
      transparent 54%,rgba(212,175,55,0.025) 55%,transparent 56%);
  animation:mandala-spin 90s linear infinite}
@keyframes mandala-spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

/* SVG Rangoli dots overlay */
.rangoli-svg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.07}

/* ── CORNER DECORATIONS ── */
.corner-decor{position:fixed;width:110px;height:110px;opacity:0.16;z-index:1;pointer-events:none}
.corner-decor.tl{top:0;left:0}.corner-decor.tr{top:0;right:0;transform:scaleX(-1)}
.corner-decor.bl{bottom:48px;left:0;transform:scaleY(-1)}.corner-decor.br{bottom:48px;right:0;transform:scale(-1,-1)}

/* ================================================================
   HEADER
================================================================ */
.header{position:relative;z-index:10;text-align:center;padding:1.3rem 1rem 0.7rem;
  border-bottom:1px solid rgba(212,175,55,0.22)}
.header-ornament{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:0.25rem;color:var(--gold)}
.ornament-line{height:1px;width:55px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.header h1{font-family:'Cinzel',serif;font-size:clamp(1.3rem,3.5vw,2.4rem);font-weight:700;
  color:var(--gold-lt);letter-spacing:0.07em;text-shadow:0 2px 20px rgba(212,175,55,0.4);transition:all 0.3s}
.header-sub{font-family:'Noto Serif',serif;font-size:0.74rem;color:var(--saffron-lt);
  letter-spacing:0.15em;text-transform:uppercase;margin-top:0.2rem;opacity:0.8}

/* Last updated badge */
.last-updated{position:absolute;top:0.6rem;right:0.8rem;font-size:0.62rem;
  color:rgba(212,175,55,0.5);font-family:'Noto Serif',serif;letter-spacing:0.04em;
  background:rgba(26,8,0,0.5);border:1px solid rgba(212,175,55,0.15);
  border-radius:4px;padding:0.18rem 0.5rem;backdrop-filter:blur(4px);
  white-space:nowrap}
@media(max-width:480px){.last-updated{position:static;display:block;text-align:center;margin-top:0.3rem}}

/* ================================================================
   SEARCH BAR
================================================================ */
.search-wrap{position:relative;z-index:20;display:flex;align-items:center;justify-content:center;
  gap:0.5rem;padding:0.55rem 1rem;border-bottom:1px solid rgba(212,175,55,0.12);flex-wrap:wrap}
.search-box{position:relative;max-width:340px;width:100%}
.search-box input{width:100%;padding:0.42rem 2.4rem 0.42rem 0.85rem;
  background:rgba(26,8,0,0.75);border:1px solid rgba(212,175,55,0.35);
  border-radius:20px;color:var(--cream);font-family:'Crimson Pro',serif;font-size:0.84rem;
  outline:none;transition:border-color .2s,box-shadow .2s;backdrop-filter:blur(6px)}
.search-box input:focus{border-color:var(--gold);box-shadow:0 0 12px rgba(212,175,55,0.25)}
.search-box input::placeholder{color:rgba(212,175,55,0.38);font-style:italic}
.search-clear{position:absolute;right:0.55rem;top:50%;transform:translateY(-50%);
  background:none;border:none;color:rgba(212,175,55,0.5);cursor:pointer;
  font-size:0.9rem;line-height:1;padding:0.15rem;transition:color .15s}
.search-clear:hover{color:var(--gold)}
/* Search suggestions dropdown */
.search-suggestions{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:100;
  background:#2C1200;border:1px solid rgba(212,175,55,0.35);border-radius:8px;
  overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.5);max-height:200px;overflow-y:auto}
.search-sug-item{padding:0.45rem 0.85rem;font-size:0.78rem;color:var(--cream-dk);
  cursor:pointer;border-bottom:1px solid rgba(212,175,55,0.1);transition:background .15s;
  display:flex;flex-direction:column;gap:2px}
.search-sug-item:last-child{border-bottom:none}
.search-sug-item:hover{background:rgba(212,175,55,0.12)}
.search-sug-item .sug-name{font-weight:500;color:var(--gold-lt);font-size:0.8rem}
.search-sug-item .sug-meta{font-size:0.66rem;color:var(--muted);font-style:italic}

/* ================================================================
   TOOLBAR
================================================================ */
.toolbar{position:relative;z-index:10;display:flex;align-items:center;justify-content:center;
  gap:0.45rem;flex-wrap:wrap;padding:0.5rem 0.8rem;border-bottom:1px solid rgba(212,175,55,0.12)}
.btn{font-family:'Cinzel',serif;font-size:0.66rem;letter-spacing:0.08em;
  padding:0.38rem 0.9rem;border-radius:4px;border:1px solid rgba(212,175,55,0.38);
  background:rgba(26,8,0,0.7);color:var(--gold-lt);cursor:pointer;
  transition:all var(--transition-speed);backdrop-filter:blur(4px);
  -webkit-tap-highlight-color:transparent;min-height:36px;touch-action:manipulation}
.btn:hover,.btn:active{background:rgba(212,175,55,0.14);border-color:var(--gold);
  box-shadow:0 0 10px rgba(212,175,55,0.22)}
.btn-primary{background:linear-gradient(135deg,var(--maroon) 0%,var(--maroon-lt) 100%);
  border-color:var(--saffron);color:var(--cream)}
.btn-primary:hover{background:linear-gradient(135deg,var(--maroon-lt) 0%,var(--saffron-dk) 100%);
  box-shadow:0 0 16px rgba(255,153,51,0.35)}
.btn-danger{background:rgba(128,0,32,0.3);border-color:rgba(255,100,80,0.4);color:#ffaaaa}
.btn-danger:hover{background:rgba(128,0,32,0.5)}

/* Language toggle pill */
.lang-toggle{display:inline-flex;align-items:center;border-radius:20px;overflow:hidden;
  border:1px solid rgba(212,175,55,0.45);background:rgba(26,8,0,0.8)}
.lang-opt{padding:0.35rem 0.8rem;font-size:0.68rem;cursor:pointer;color:rgba(240,208,96,0.55);
  font-family:'Cinzel',serif;letter-spacing:0.07em;border:none;background:transparent;
  transition:all .2s;min-height:34px;touch-action:manipulation}
.lang-opt.active{background:linear-gradient(135deg,var(--maroon),var(--maroon-lt));
  color:var(--cream);font-weight:600}
.lang-opt:first-child{border-right:1px solid rgba(212,175,55,0.2)}

/* You-bar */
.you-bar{position:relative;z-index:10;text-align:center;padding:0.28rem 1rem;
  background:rgba(255,153,51,0.1);border-bottom:1px solid rgba(255,153,51,0.2);
  font-size:0.72rem;color:var(--saffron-lt);letter-spacing:0.03em;display:none}
.you-bar b{color:var(--gold-lt)}
.hint-bar{position:relative;z-index:10;text-align:center;padding:0.18rem;
  font-size:0.64rem;color:rgba(212,175,55,0.3);letter-spacing:0.05em}

/* ================================================================
   TREE VIEWPORT — ZOOM & PAN
================================================================ */
.tree-viewport{position:relative;z-index:5;overflow:hidden;flex:1;cursor:grab;
  height:calc(100vh - 260px);min-height:380px;touch-action:none}
.tree-viewport.panning{cursor:grabbing}
.tree-canvas{position:absolute;transform-origin:0 0;padding:3rem 4rem 5rem;
  display:inline-flex;flex-direction:column;align-items:center;will-change:transform;
  transition:transform 0.04s linear}

/* ================================================================
   NODE STYLES
================================================================ */
.p-col{display:flex;flex-direction:column;align-items:center}
.couple-wrap{display:flex;align-items:center}

/* Spouse connector line */
.sp-line{width:18px;height:2px;
  background:linear-gradient(90deg,var(--gold-dk),var(--saffron-dk));
  flex-shrink:0;position:relative}
.sp-line::after{content:'✦';position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);font-size:6px;color:var(--gold)}

/* Node card */
.node-box{min-width:84px;max-width:118px;padding:0.36rem 0.62rem 0.3rem;
  border-radius:9px;background:var(--node-bg);border:1.5px solid var(--node-border);
  box-shadow:0 2px 10px var(--shadow-warm),inset 0 1px 0 rgba(255,255,255,0.75);
  cursor:pointer;text-align:center;position:relative;
  transition:transform var(--transition-speed),box-shadow var(--transition-speed),
    border-color var(--transition-speed),opacity var(--transition-speed);
  animation:node-appear 0.35s ease both}
@keyframes node-appear{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.node-box::before{content:'';position:absolute;inset:-1px;border-radius:10px;
  background:linear-gradient(135deg,rgba(212,175,55,0.28) 0%,transparent 55%,rgba(255,153,51,0.12) 100%);
  pointer-events:none}
.node-box:hover{transform:translateY(-2px) scale(1.05);
  box-shadow:0 8px 22px rgba(180,100,0,0.32),inset 0 1px 0 rgba(255,255,255,0.9);
  border-color:var(--saffron);z-index:20}

/* YOU highlight */
.node-box.is-you{background:linear-gradient(155deg,#FFFCE0 0%,#FFE89A 100%);
  border-color:var(--saffron);z-index:15;
  box-shadow:0 0 0 3px rgba(255,153,51,0.28),0 0 24px var(--glow-you),
    0 4px 16px rgba(200,100,0,0.38),inset 0 1px 0 rgba(255,255,255,0.9);
  animation:you-pulse 2.8s ease-in-out infinite,node-appear 0.35s ease both}
@keyframes you-pulse{
  0%,100%{box-shadow:0 0 0 3px rgba(255,153,51,0.25),0 0 20px rgba(255,153,51,0.5),0 4px 14px rgba(200,100,0,0.35)}
  50%  {box-shadow:0 0 0 6px rgba(255,153,51,0.1),0 0 40px rgba(255,153,51,0.8),0 4px 20px rgba(200,100,0,0.45)}}

/* SEARCH highlight */
.node-box.search-hit{border-color:var(--gold-lt);z-index:18;
  background:linear-gradient(155deg,#FFFFF0 0%,#FFEDAA 100%);
  box-shadow:0 0 0 3px rgba(255,215,0,0.4),0 0 28px rgba(255,215,0,0.7),0 4px 16px rgba(180,140,0,0.4);
  animation:search-pulse 1.8s ease-in-out infinite,node-appear 0.35s ease both;
  transform:scale(1.08)}
@keyframes search-pulse{
  0%,100%{box-shadow:0 0 0 3px rgba(255,215,0,0.35),0 0 22px rgba(255,215,0,0.6)}
  50%    {box-shadow:0 0 0 6px rgba(255,215,0,0.15),0 0 38px rgba(255,215,0,0.9)}}

/* LINEAGE PATH highlight */
.node-box.on-path{border-color:var(--path-color);z-index:16;
  box-shadow:0 0 0 2px rgba(255,215,0,0.5),0 0 18px rgba(255,215,0,0.6);
  background:linear-gradient(155deg,#FFFAE8 0%,#FFE9A0 100%)}

/* DIMMED (when relationship mode active) */
.node-box.dimmed{opacity:var(--dim-opacity);filter:grayscale(60%)}

/* Node text */
.node-name{font-family:'Crimson Pro',serif;font-weight:500;font-size:0.73rem;
  color:var(--ink);line-height:1.25;display:block}
.node-name.you-nm{color:var(--maroon);font-weight:700}
.node-rel{display:block;font-family:'Cinzel',serif;font-size:0.54rem;
  letter-spacing:0.05em;color:var(--maroon-lt);margin-top:2px;line-height:1.3}
.node-rel.rel-you{color:var(--maroon-dk);font-weight:700;
  background:rgba(255,153,51,0.22);border-radius:3px;padding:1px 4px}

/* ================================================================
   TREE CONNECTORS
================================================================ */
.v-conn{width:1.5px;background:linear-gradient(180deg,var(--gold-dk),rgba(180,120,0,0.25));flex-shrink:0}

/* Animated path connector (lineage highlight) */
.v-conn.path-conn{background:linear-gradient(180deg,#FFD700,#FFA500);
  width:2.5px;box-shadow:0 0 6px rgba(255,215,0,0.7);
  animation:path-flow 1.2s linear infinite}
@keyframes path-flow{
  0%{background:linear-gradient(180deg,#FFD700 0%,#FFA500 50%,#FFD700 100%)}
  100%{background:linear-gradient(180deg,#FFA500 0%,#FFD700 50%,#FFA500 100%)}}

.tog{width:15px;height:15px;border-radius:50%;
  background:radial-gradient(circle,var(--cream) 60%,var(--cream-dk) 100%);
  border:1px solid var(--gold-dk);display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:8px;color:var(--maroon);font-weight:700;flex-shrink:0;
  margin:1px 0;transition:all .18s;box-shadow:0 1px 4px rgba(180,100,0,0.22);
  font-family:monospace;line-height:1;user-select:none;
  min-width:15px;min-height:15px;touch-action:manipulation}
.tog:hover,.tog:active{background:radial-gradient(circle,var(--saffron-lt) 60%,var(--saffron) 100%);
  border-color:var(--saffron);box-shadow:0 0 8px rgba(255,153,51,0.45)}

.ch-area{display:flex;flex-direction:column;align-items:center}
.ch-row{display:flex;align-items:flex-start;position:relative}
.ch-col{display:flex;flex-direction:column;align-items:center;padding:0 5px;
  animation:slide-in 0.3s ease both}
@keyframes slide-in{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

/* Horizontal connector bar */
.h-bar-connector{position:absolute;top:0;height:1.5px;
  background:linear-gradient(90deg,transparent,var(--gold-dk),var(--gold-dk),transparent);
  pointer-events:none}
.h-bar-connector.path-h{background:linear-gradient(90deg,transparent,#FFD700,#FFD700,transparent);
  height:2.5px;box-shadow:0 0 6px rgba(255,215,0,0.7);animation:path-flow-h 1.2s linear infinite}
@keyframes path-flow-h{
  0%{background:linear-gradient(90deg,transparent,#FFD700,#FFA500,transparent)}
  100%{background:linear-gradient(90deg,transparent,#FFA500,#FFD700,transparent)}}

/* ================================================================
   MODAL
================================================================ */
.modal-overlay{position:fixed;inset:0;z-index:999;background:rgba(10,2,0,0.82);
  display:flex;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(6px)}
.modal{background:linear-gradient(160deg,#2C1200 0%,#1A0800 100%);
  border:1px solid rgba(212,175,55,0.4);border-radius:12px;padding:1.8rem;
  width:100%;max-width:420px;max-height:90vh;overflow-y:auto;
  box-shadow:0 0 0 1px rgba(255,153,51,0.1),0 24px 60px rgba(0,0,0,0.6);
  position:relative;overflow:hidden}
.modal::before{content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 0% 0%,rgba(212,175,55,0.07) 0%,transparent 60%),
  radial-gradient(circle at 100% 100%,rgba(255,153,51,0.05) 0%,transparent 50%);pointer-events:none}
.modal h2{font-family:'Cinzel',serif;font-size:1.2rem;color:var(--gold-lt);
  margin-bottom:0.35rem;letter-spacing:0.05em}
.modal p{font-size:0.79rem;color:rgba(255,220,150,0.62);margin-bottom:1.2rem;line-height:1.6}
.fgrp{margin-bottom:0.85rem}
.fgrp label{display:block;font-family:'Cinzel',serif;font-size:0.6rem;
  letter-spacing:0.1em;color:var(--saffron-lt);margin-bottom:0.28rem;text-transform:uppercase}
.fgrp input,.fgrp select{width:100%;padding:0.48rem 0.78rem;background:rgba(0,0,0,0.4);
  border:1px solid rgba(212,175,55,0.33);border-radius:6px;color:var(--cream);
  font-family:'Crimson Pro',serif;font-size:0.86rem;outline:none;
  transition:border-color .18s,box-shadow .18s}
.fgrp input:focus,.fgrp select:focus{border-color:var(--saffron);
  box-shadow:0 0 10px rgba(255,153,51,0.2)}
.fgrp select option{background:#2C1200}
.modal-err{font-size:0.73rem;color:#ffaaaa;margin-top:0.35rem;min-height:1.1em}
.modal-divider{width:100%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(212,175,55,0.3),transparent);margin:0.9rem 0}
.modal-footer{display:flex;gap:0.6rem;justify-content:flex-end;margin-top:1rem}

/* ================================================================
   TIMELINE (bottom marquee)
================================================================ */
.timeline-wrap{position:fixed;bottom:0;left:0;right:0;z-index:50;height:38px;
  background:linear-gradient(90deg,var(--maroon-dk) 0%,#3D0010 30%,#3D0010 70%,var(--maroon-dk) 100%);
  border-top:1px solid rgba(212,175,55,0.32);overflow:hidden;display:flex;align-items:center}
.timeline-wrap::before,.timeline-wrap::after{content:'';position:absolute;top:0;bottom:0;width:70px;z-index:2}
.timeline-wrap::before{left:0;background:linear-gradient(90deg,#200008,transparent)}
.timeline-wrap::after{right:0;background:linear-gradient(270deg,#200008,transparent)}
.timeline-track{display:flex;align-items:center;white-space:nowrap;
  animation:scroll-rtl 34s linear infinite;will-change:transform}
.timeline-track:hover{animation-play-state:paused}
@keyframes scroll-rtl{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.timeline-seg{display:inline-flex;align-items:center;gap:14px;padding:0 32px}
.timeline-gem{display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 6px rgba(212,175,55,0.6);flex-shrink:0}
.timeline-text{font-family:'Crimson Pro',serif;font-size:0.78rem;font-style:italic;
  color:rgba(253,240,180,0.82);letter-spacing:0.03em}
.timeline-text b{font-style:normal;font-weight:600;color:var(--gold-lt)}
body.lang-te .timeline-text{font-family:'Noto Serif Telugu',serif;font-style:normal;font-size:0.76rem}

/* ================================================================
   ZOOM CONTROLS
================================================================ */
.zoom-indicator{position:fixed;bottom:46px;right:10px;z-index:40;
  display:flex;flex-direction:column;gap:4px;align-items:center}
.zoom-btn{width:28px;height:28px;border-radius:50%;
  background:rgba(40,15,0,0.85);border:1px solid rgba(212,175,55,0.35);
  color:var(--gold-lt);font-size:1rem;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
  backdrop-filter:blur(4px);font-family:monospace;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.zoom-btn:hover,.zoom-btn:active{background:rgba(212,175,55,0.2);border-color:var(--gold);
  box-shadow:0 0 10px rgba(212,175,55,0.3)}
.zoom-label{font-family:'Cinzel',serif;font-size:0.55rem;
  color:rgba(212,175,55,0.5);letter-spacing:0.07em}

/* ================================================================
   LEGEND
================================================================ */
.legend{position:fixed;bottom:46px;left:10px;z-index:40;display:flex;flex-direction:column;
  gap:5px;background:rgba(20,5,0,0.78);border:1px solid rgba(212,175,55,0.18);
  border-radius:8px;padding:0.42rem 0.72rem;backdrop-filter:blur(4px)}
.leg-item{display:flex;align-items:center;gap:6px;font-size:0.61rem;
  color:rgba(253,240,180,0.58);font-family:'Noto Serif',serif}

/* ================================================================

================================================================ */
let _uid = 1;
const G = {}; // id → person node

function mkId(){ return 'N'+(++_uid); }

function person(name, gender){
  const id = mkId();
  G[id] = { id, name, gender:gender||'m', fatherId:null, motherId:null, spouseId:null, childrenIds:[] };
  return id;
}
function marry(aId, bId){
  if(!aId||!bId) return;
  G[aId].spouseId = bId; G[bId].spouseId = aId;
}
function addChildren(parentId, spouseId, childIds){
  if(parentId && G[parentId]) G[parentId].childrenIds = childIds;
  childIds.forEach(cId => {
    if(!G[cId]) return;
    const pg = G[parentId];
    if(pg){
      if(pg.gender==='m'){ G[cId].fatherId=parentId; if(spouseId) G[cId].motherId=spouseId; }
      else               { G[cId].motherId=parentId; if(spouseId) G[cId].fatherId=spouseId; }
    }
  });
}

/* ================================================================
   MODULE: RELATIONSHIP ENGINE — BFS + LCA
================================================================ */

/** BFS upward: returns Map<id, depth> for all ancestors */
function ancestorMap(id){
  const dist = new Map();
  const q = [[id, 0]];
  while(q.length){
    const [cur, d] = q.shift();
    if(dist.has(cur)) continue;
    dist.set(cur, d);
    const p = G[cur]; if(!p) continue;
    if(p.fatherId) q.push([p.fatherId, d+1]);
    if(p.motherId) q.push([p.motherId, d+1]);
  }
  return dist;
}

/** Find Lowest Common Ancestor between two IDs */
function findLCA(aId, bId){
  const ancsA = ancestorMap(aId);
  const ancsB = ancestorMap(bId);
  let best = null;
  ancsA.forEach((dA, node) => {
    if(ancsB.has(node)){
      const dB = ancsB.get(node), total = dA + dB;
      if(!best || total < best.total || (total === best.total && dA < best.dA))
        best = { lca: node, dA, dB, total };
    }
  });
  return best;
}

/** Returns the full ancestor path from id up to ancestorId */
function getPathToAncestor(id, ancestorId){
  const path = [id];
  let cur = id;
  while(cur !== ancestorId){
    const p = G[cur];
    if(!p) break;
    // Prefer father path, fall back to mother
    let next = null;
    if(p.fatherId && G[p.fatherId]){
      const am = ancestorMap(ancestorId);
      // Walk whichever parent leads toward ancestorId
      const viaFather = ancestorMap(p.fatherId).has(ancestorId) || p.fatherId === ancestorId;
      const viaMother = p.motherId && (ancestorMap(p.motherId).has(ancestorId) || p.motherId === ancestorId);
      if(viaFather) next = p.fatherId;
      else if(viaMother) next = p.motherId;
      else next = p.fatherId;
    } else if(p.motherId){
      next = p.motherId;
    } else break;
    if(path.includes(next)) break;
    path.push(next);
    cur = next;
  }
  return path;
}

/** Build the set of IDs on the lineage path between youId and targetId */
function buildLinagePath(youId, targetId){
  const lca = findLCA(youId, targetId);
  if(!lca) return new Set();
  const pathA = getPathToAncestor(youId, lca.lca);
  const pathB = getPathToAncestor(targetId, lca.lca);
  return new Set([...pathA, ...pathB]);
}

function ordinal(n){ const s=['th','st','nd','rd'],v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }

/** Compute relationship key (language-neutral) between youId → targetId */
function computeRelKey(youId, targetId){
  if(!youId || !targetId) return null;
  if(youId === targetId) return 'You';
  const you = G[youId], tgt = G[targetId];
  if(!you || !tgt) return null;
  const f = tgt.gender === 'f';

  if(you.spouseId === targetId) return 'Spouse';

  const lca = findLCA(youId, targetId);

  if(!lca){
    // Check in-law via spouse of blood relative
    const partner = Object.values(G).find(p => p.spouseId === targetId);
    if(partner){
      const pRel = computeRelKey(youId, partner.id); if(!pRel) return null;
      if(pRel==='Father'||pRel==='Mother')           return f?'MotherInLaw':'FatherInLaw';
      if(pRel==='Son'||pRel==='Daughter')             return f?'DaughterInLaw':'SonInLaw';
      if(pRel==='Brother'||pRel==='Sister')           return f?'SisterInLaw':'BrotherInLaw';
      if(pRel==='Uncle'||pRel==='Aunt')               return f?'AuntMarriage':'UncleMarriage';
      if(pRel&&pRel.includes('Cousin'))               return 'CousinSpouse';
      if(pRel==='Grandson'||pRel==='Granddaughter')   return f?'GranddaughterInLaw':'GrandsonInLaw';
      return null;
    }
    return null;
  }

  const { dA, dB } = lca;

  if(dA===0){
    if(dB===1) return f?'Daughter':'Son';
    if(dB===2) return f?'Granddaughter':'Grandson';
    if(dB===3) return f?'GreatGranddaughter':'GreatGrandson';
    return `${dB-1}xGGrand_${f?'d':'s'}`;
  }
  if(dB===0){
    if(dA===1) return f?'Mother':'Father';
    if(dA===2) return f?'Grandmother':'Grandfather';
    if(dA===3) return f?'GreatGrandmother':'GreatGrandfather';
    return `${dA-1}xGGrand_${f?'m':'f'}`;
  }
  if(dA===1&&dB===1) return f?'Sister':'Brother';
  if(dA===2&&dB===1) return f?'Aunt':'Uncle';
  if(dA===1&&dB===2) return f?'Niece':'Nephew';
  if(dA===3&&dB===1) return f?'GrandAunt':'GrandUncle';
  if(dA===1&&dB===3) return f?'GrandNiece':'GrandNephew';
  if(dA>=4&&dB===1)  return f?`GrGrandAunt_${dA-2}`:`GrGrandUncle_${dA-2}`;
  if(dA===1&&dB>=4)  return f?`GrGrandNiece_${dB-2}`:`GrGrandNephew_${dB-2}`;
  if(dA===dB){ const n=dA-1; return n===1?'Cousin':`Cousin${n}`; }
  const minD=Math.min(dA,dB), removed=Math.abs(dA-dB), n=minD-1;
  return `Cousin${n>1?n:'1'}_rem${removed}`;
}

/** Translate a relationship key to display string in current language */
function relLabel(key){
  if(!key) return '';
  // Compound keys for extended relations
  if(key.includes('xGGrand_')){
    const [gen, gender] = key.split('xGGrand_');
    const n = parseInt(gen);
    if(lang==='te'){
      const gn = gender==='d'?'మనవరాలు':gender==='s'?'మనవడు':gender==='m'?'నానమ్మ':'తాత';
      return `${n}వ తరం ${gn}`;
    }
    const gn = gender==='d'?'Granddaughter':gender==='s'?'Grandson':gender==='m'?'Grandmother':'Grandfather';
    return `${n}× Great-${gn}`;
  }
  if(key.startsWith('GrGrand')){
    const m = key.match(/^GrGrand(Uncle|Aunt|Nephew|Niece)_(\d+)$/);
    if(m){
      const label = m[1]==='Uncle'?t('GrandUncle'):m[1]==='Aunt'?t('GrandAunt'):m[1]==='Nephew'?t('GrandNephew'):t('GrandNiece');
      return lang==='te'?`${m[2]}వ తరం ${label}`:`${m[2]}× Great-${m[1]}`;
    }
  }
  if(key.startsWith('Cousin')){
    const remM = key.match(/^Cousin(\d*)_rem(\d+)$/);
    if(remM){
      const n = parseInt(remM[1])||1;
      const r = parseInt(remM[2]);
      const base = t('Cousin');
      return lang==='te'?`${base} (${r} తరం దూరం)`:`${ordinal(n)} Cousin (${r}× removed)`;
    }
    const nM = key.match(/^Cousin(\d+)$/);
    if(nM){ const n=parseInt(nM[1]); return lang==='te'?`${t('Cousin')} (${n}వ)`:`${ordinal(n)} Cousin`; }
    return t('Cousin');
  }
  return t(key) || key;
}

/** Build full relMap: id → display string */
function buildRelMap(youId){
  const map = {};
  Object.keys(G).forEach(id => {
    const k = computeRelKey(youId, id);
    if(k) map[id] = k;
  });
  return map;
}

let youId       = null;   // selected "you" person ID
let relMap      = {};     // id → relationship key
let collapsed   = {};     // id → true if collapsed
let pathSet     = new Set(); // IDs on lineage path
let searchHitId = null;   // single search result ID
let dimMode     = false;  // true when lineage path dimming is active

/** Determine CSS classes for a node box */
function nodeBoxClass(id){
  let cls = 'node-box';
  if(id === youId)       cls += ' is-you';
  if(id === searchHitId) cls += ' search-hit';
  if(pathSet.has(id) && id !== youId) cls += ' on-path';
  if(dimMode && !pathSet.has(id) && id !== youId && id !== searchHitId) cls += ' dimmed';
  return cls;
}

/** Connector line class (animated when on lineage path) */
function vConnClass(childId){
  if(pathSet.size > 0){
    const p = G[childId];
    if(p && (pathSet.has(childId) || pathSet.has(p.fatherId) || pathSet.has(p.motherId)))
      return 'v-conn path-conn';
  }
  return 'v-conn';
}

function renderNodeHTML(id){
  const p = G[id]; if(!p) return '';
  const isYou    = id === youId;
  const relKey   = relMap[id] || null;
  const relDisp  = relKey ? relLabel(relKey) : '';

  const nameCls = 'node-name' + (isYou ? ' you-nm' : '');
  const relCls  = 'node-rel'  + (isYou ? ' rel-you' : '');

  // Build the primary node box
  let nodeInner = `
    <div class="${nodeBoxClass(id)}" data-id="${id}" onclick="nodeClick('${id}')">
      <span class="${nameCls}">${p.name}</span>
      ${relDisp ? `<span class="${relCls}">${relDisp}</span>` : ''}
    </div>`;

  // Spouse box
  let couple = `<div class="couple-wrap">${nodeInner}`;
  if(p.spouseId && G[p.spouseId]){
    const sp = G[p.spouseId];
    const spRelKey  = relMap[p.spouseId] || null;
    const spRelDisp = spRelKey ? relLabel(spRelKey) : '';
    const spIsYou   = p.spouseId === youId;
    const spNameCls = 'node-name' + (spIsYou ? ' you-nm' : '');
    const spRelCls  = 'node-rel'  + (spIsYou ? ' rel-you' : '');
    couple += `
      <div class="sp-line"></div>
      <div class="${nodeBoxClass(p.spouseId)}" data-id="${p.spouseId}" onclick="nodeClick('${p.spouseId}')">
        <span class="${spNameCls}">${sp.name}</span>
        ${spRelDisp ? `<span class="${spRelCls}">${spRelDisp}</span>` : ''}
      </div>`;
  }
  couple += '</div>';

  // Children area
  const hasChildren = p.childrenIds && p.childrenIds.length > 0;
  const isColl = collapsed[id];
  let childHTML = '';
  if(hasChildren){
    childHTML = `<div class="ch-area">
      <div class="${vConnClass(id)}" style="height:10px"></div>
      <div class="tog" onclick="togNode(event,'${id}')">${isColl ? '+' : '&minus;'}</div>`;
    if(!isColl){
      childHTML += `<div class="${vConnClass(id)}" style="height:8px"></div>`;
      childHTML += renderChildrenRow(p.childrenIds);
    }
    childHTML += '</div>';
  }
  return `<div class="p-col">${couple}${childHTML}</div>`;
}

function renderChildrenRow(ids){
  const valid = ids.filter(id => G[id]);
  if(!valid.length) return '';

  // Determine if this h-bar should be path-highlighted
  const anyOnPath = valid.some(id => pathSet.has(id));
  const barCls = anyOnPath && pathSet.size > 0 ? 'h-bar-connector path-h' : 'h-bar-connector';

  const cols = valid.map(cid => {
    const connCls = vConnClass(cid);
    return `<div class="ch-col">
      <div class="${connCls}" style="height:12px"></div>
      ${renderNodeHTML(cid)}
    </div>`;
  }).join('');

  const bar = valid.length > 1
    ? `<div class="${barCls}" style="left:calc(50% - ${(valid.length*0.5-0.5)*80}px);width:calc(100% - 90px)"></div>`
    : '';

  return `<div class="ch-row">${bar}${cols}</div>`;
}

function renderTree(){
  const canvas = document.getElementById('tree-canvas');
  if(canvas) canvas.innerHTML = renderNodeHTML(P_Veraiah);
}

let searchTimeout = null;

function initSearch(){
  const input = document.getElementById('search-input');
  const clearBtn = document.getElementById('search-clear');
  const sugBox   = document.getElementById('search-suggestions');

  input.addEventListener('input', () => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => handleSearch(input.value), 220);
  });

  input.addEventListener('keydown', e => {
    if(e.key === 'Escape') clearSearch();
  });

  clearBtn.addEventListener('click', clearSearch);

  // Close suggestions on outside click
  document.addEventListener('click', e => {
    if(!document.getElementById('search-box-wrap').contains(e.target)){
      sugBox.style.display = 'none';
    }
  });
}

function handleSearch(query){
  const sug = document.getElementById('search-suggestions');
  const q = query.trim().toLowerCase();

  if(!q){ clearSearch(); return; }

  // Find all matches
  const matches = Object.values(G).filter(p => p.name.toLowerCase().includes(q));

  if(matches.length === 0){
    searchHitId = null; sug.style.display = 'none'; renderTree(); return;
  }

  if(matches.length === 1){
    // Exact single match — highlight immediately
    sug.style.display = 'none';
    applySearchHit(matches[0].id);
  } else {
    // Show suggestions
    sug.innerHTML = matches.slice(0, 12).map(p => {
      const father = p.fatherId ? G[p.fatherId]?.name : (p.motherId ? G[p.motherId]?.name : '');
      const meta   = father ? `S/o · D/o ${father}` : (p.spouseId ? `Spouse: ${G[p.spouseId]?.name}` : '');
      return `<div class="search-sug-item" onclick="selectSuggestion('${p.id}')">
        <span class="sug-name">${p.name}</span>
        ${meta ? `<span class="sug-meta">${meta}</span>` : ''}
      </div>`;
    }).join('');
    sug.style.display = 'block';
    // Still highlight first match faintly
    searchHitId = null; renderTree();
  }
}

function selectSuggestion(id){
  document.getElementById('search-suggestions').style.display = 'none';
  document.getElementById('search-input').value = G[id]?.name || '';
  applySearchHit(id);
}

function applySearchHit(id){
  searchHitId = id;
  // Auto-expand ancestors so node is visible
  expandAncestors(id);
  renderTree();
  // Scroll to the node after render
  setTimeout(() => scrollToNode(id), 60);
}

/** Expand all ancestors of a node to make it visible */
function expandAncestors(id){
  let cur = id;
  while(cur){
    const p = G[cur];
    if(!p) break;
    // Find parent who has this as a child
    const parentId = Object.keys(G).find(pid =>
      G[pid].childrenIds && G[pid].childrenIds.includes(cur)
    );
    if(parentId){
      collapsed[parentId] = false;
      cur = parentId;
    } else break;
  }
}

/** Pan viewport to center a node by its data-id */
function scrollToNode(id){
  const el = document.querySelector(`[data-id="${id}"]`);
  const vp = document.getElementById('tree-viewport');
  if(!el || !vp) return;
  const rect  = el.getBoundingClientRect();
  const vpRect = vp.getBoundingClientRect();
  const targetX = rect.left + rect.width/2  - vpRect.left  - vpRect.width/2;
  const targetY = rect.top  + rect.height/2 - vpRect.top   - vpRect.height/2;
  tx -= targetX; ty -= targetY;
  applyT(true);
}

function clearSearch(){
  searchHitId = null;
  document.getElementById('search-input').value = '';
  document.getElementById('search-suggestions').style.display = 'none';
  renderTree();
}

/* ================================================================
   MODULE: TOOLBAR & BARS
================================================================ */
function renderToolbar(){
  const tb = document.getElementById('toolbar'); if(!tb) return;
  tb.innerHTML = `
    <div class="lang-toggle">
      <button class="lang-opt${lang==='en'?' active':''}" onclick="setLang('en')">EN</button>
      <button class="lang-opt${lang==='te'?' active':''}" onclick="setLang('te')">తె Telugu</button>
    </div>
    <button class="btn btn-primary" onclick="openModal()">${t('btnRelation')}</button>
    <button class="btn" onclick="expandAll()">${t('btnExpand')}</button>
    <button class="btn" onclick="collapseAll()">${t('btnCollapse')}</button>
    ${youId ? `<button class="btn btn-danger" onclick="clearYou()">${t('btnClear')}</button>` : ''}`;
}

function renderYouBar(){
  const bar = document.getElementById('you-bar'); if(!bar) return;
  if(youId){
    bar.style.display = 'block';
    bar.innerHTML = `${t('youBarPre')} <b>${G[youId].name}</b> &nbsp;·&nbsp; ${t('youBarSuf')}`;
  } else { bar.style.display = 'none'; }
}

/* ================================================================
   MODULE: ACTIONS
================================================================ */
function nodeClick(id){
  // Click on a node during search → jump to relationship modal
}

function togNode(e, id){
  e.stopPropagation();
  collapsed[id] = !collapsed[id];
  renderTree();
}

function expandAll(){ collapsed = {}; renderTree(); }

function collapseAll(){
  Object.keys(G).forEach(id => {
    if(G[id].childrenIds && G[id].childrenIds.length) collapsed[id] = true;
  });
  renderTree();
}

function clearYou(){
  youId = null; relMap = {}; pathSet = new Set(); dimMode = false;
  renderToolbar(); renderYouBar(); renderTree();
}

function setYou(id){
  youId   = id;
  relMap  = buildRelMap(id);
  pathSet = new Set(); dimMode = false; // reset, will be set per targetId below
  renderToolbar(); renderYouBar(); renderTree();
}

/* ================================================================
   MODULE: MODAL — Know Your Relationship
================================================================ */
function openModal(){
  const fList = Object.values(G)
    .filter(p => p.childrenIds && p.childrenIds.length)
    .sort((a,b) => a.name.localeCompare(b.name));
  const fOpts = fList.map(f => `<option value="${f.id}">${f.name}</option>`).join('');
  const teF = lang==='te' ? 'font-family:"Noto Serif Telugu",serif;' : '';

  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay" id="moverlay" onclick="mClick(event)">
      <div class="modal" style="${teF}">
        <h2>${t('modalTitle')}</h2>
        <p>${t('modalDesc')}</p>
        <div class="fgrp">
          <label>${t('labelName')}</label>
          <input id="inp-name" placeholder="${t('placeholderName')}" onkeydown="if(event.key==='Enter')doFind()"/>
        </div>
        <div class="fgrp">
          <label>${t('labelFather')} <span style="font-size:.55rem;opacity:.5">${t('labelFatherHint')}</span></label>
          <select id="inp-father">
            <option value="">${t('fatherDefault')}</option>
            ${fOpts}
          </select>
        </div>
        <div id="modal-err" class="modal-err"></div>
        <div class="modal-divider"></div>
        <div class="modal-footer">
          <button class="btn" onclick="closeModal()">${t('btnCancel')}</button>
          <button class="btn btn-primary" onclick="doFind()">${t('btnFind')}</button>
        </div>
      </div>
    </div>`;
  setTimeout(() => { const el = document.getElementById('inp-name'); if(el) el.focus(); }, 50);
}

function mClick(e){ if(e.target.id === 'moverlay') closeModal(); }
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }

function doFind(){
  const name  = (document.getElementById('inp-name').value || '').trim().toLowerCase();
  const fid   = document.getElementById('inp-father').value;
  const errEl = document.getElementById('modal-err');

  if(!name){ errEl.textContent = t('errNoName'); return; }

  let matches = Object.values(G).filter(p => p.name.toLowerCase() === name);
  if(fid) matches = matches.filter(p => p.fatherId === fid || p.motherId === fid);

  if(matches.length === 0){ errEl.textContent = t('errNotFound'); return; }
  if(matches.length > 1)  { errEl.textContent = t('errMultiple'); return; }

  closeModal();
  const foundId = matches[0].id;
  setYou(foundId);

  // After setting "you", compute lineage path to all blood relatives and dim others
  activateLineageMode(foundId);
}

/** Highlight the lineage path and dim non-related nodes */
function activateLineageMode(youId){
  // Build union of all paths from youId to each known relative
  const allPathIds = new Set([youId]);
  // Add ancestors
  ancestorMap(youId).forEach((d, id) => allPathIds.add(id));
  // Add descendants
  function addDesc(id){
    const p = G[id]; if(!p) return;
    if(p.childrenIds) p.childrenIds.forEach(cid => { allPathIds.add(cid); addDesc(cid); });
  }
  addDesc(youId);
  // Add spouses of path members
  const extras = [];
  allPathIds.forEach(id => { if(G[id]?.spouseId) extras.push(G[id].spouseId); });
  extras.forEach(id => allPathIds.add(id));

  pathSet = allPathIds;
  dimMode = true;
  renderTree();

  // Auto-expand to show you node
  expandAncestors(youId);
  renderTree();
  setTimeout(() => scrollToNode(youId), 80);
}

/* ================================================================
   MODULE: ZOOM & PAN
================================================================ */
let scale = 0.85, tx = 0, ty = 20;
let isPanning = false, lastX = 0, lastY = 0;

function applyT(anim){
  const c = document.getElementById('tree-canvas'); if(!c) return;
  c.style.transition = anim ? 'transform 0.3s ease' : 'none';
  c.style.transform  = `translate(${tx}px,${ty}px) scale(${scale})`;
  const lbl = document.getElementById('zoom-label');
  if(lbl) lbl.textContent = Math.round(scale * 100) + '%';
}

function centerTree(){
  const vp = document.getElementById('tree-viewport');
  const c  = document.getElementById('tree-canvas');
  if(!vp || !c) return;
  tx = Math.max((vp.clientWidth - c.scrollWidth * scale) / 2, 20);
  ty = 20;
  applyT(true);
}

document.getElementById('zoom-in').onclick    = () => { scale = Math.min(scale * 1.2, 3); applyT(true); };
document.getElementById('zoom-out').onclick   = () => { scale = Math.max(scale / 1.2, 0.15); applyT(true); };
document.getElementById('zoom-reset').onclick = () => { scale = 0.85; centerTree(); };

const vpEl = document.getElementById('tree-viewport');

// Mouse wheel zoom
vpEl.addEventListener('wheel', e => {
  e.preventDefault();
  const d = e.deltaY > 0 ? 0.9 : 1.1;
  const r = vpEl.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const ns = Math.min(Math.max(scale * d, 0.15), 3);
  tx = mx - (mx - tx) * (ns / scale);
  ty = my - (my - ty) * (ns / scale);
  scale = ns; applyT(false);
}, { passive: false });

// Mouse drag
vpEl.addEventListener('mousedown', e => {
  if(e.button !== 0) return;
  isPanning = true; lastX = e.clientX; lastY = e.clientY;
  vpEl.classList.add('panning');
});
window.addEventListener('mousemove', e => {
  if(!isPanning) return;
  tx += e.clientX - lastX; ty += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY; applyT(false);
});
window.addEventListener('mouseup', () => { isPanning = false; vpEl.classList.remove('panning'); });

// Touch pan & pinch-zoom
let ltx = 0, lty = 0, ld = 0;
vpEl.addEventListener('touchstart', e => {
  if(e.touches.length === 1){ ltx = e.touches[0].clientX; lty = e.touches[0].clientY; }
  else if(e.touches.length === 2)
    ld = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
}, { passive: true });
vpEl.addEventListener('touchmove', e => {
  e.preventDefault();
  if(e.touches.length === 1){
    tx += e.touches[0].clientX - ltx; ty += e.touches[0].clientY - lty;
    ltx = e.touches[0].clientX; lty = e.touches[0].clientY; applyT(false);
  } else if(e.touches.length === 2){
    const nd = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    if(ld){ scale = Math.min(Math.max(scale * (nd / ld), 0.15), 3); applyT(false); }
    ld = nd;
  }
}, { passive: false });

/* ================================================================
   MODULE: TIMELINE
================================================================ */
function buildTimeline(){
  const track = document.getElementById('timeline-track');
  const seg = `<span class="timeline-seg">
    <span class="timeline-gem"></span>
    <span class="timeline-text">${t('timeline')}</span>
    <span class="timeline-gem"></span>
  </span>`;
  track.innerHTML = seg.repeat(6);
}

   BOOT — initialise everything
================================================================ */
applyUIStrings();
initSearch();
renderToolbar();
renderYouBar();
renderTree();
buildTimeline();
setTimeout(centerTree, 120);
