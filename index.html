<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Thota Family Tree · థోటా వంశ వృక్షం</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;1,400&family=Noto+Serif+Telugu:wght@300;400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600&family=Noto+Serif:wght@300;400&display=swap" rel="stylesheet">
<style>
/* ================================================================
   RESET & CSS VARIABLES
================================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --saffron:#FF9933;--saffron-lt:#FFB566;--saffron-dk:#CC6600;
  --gold:#D4AF37;--gold-lt:#F0D060;--gold-dk:#A07820;
  --maroon:#800020;--maroon-lt:#A0304A;--maroon-dk:#500010;
  --green-dk:#1B4332;--green:#2D6A4F;
  --cream:#FDF6E3;--cream-dk:#F5E8C0;
  --ink:#1A0800;--ink-lt:#3D1A00;--muted:#7A5C3A;
  --node-bg:rgba(253,246,227,0.97);
  --node-border:#C8921A;
  --shadow-warm:rgba(180,100,0,0.18);
  --glow-you:rgba(255,153,51,0.65);
  --path-color:#FFD700;
  --search-glow:rgba(255,215,0,0.8);
  --dim-opacity:0.18;
  --transition-speed:0.25s;
}

html,body{width:100%;min-height:100vh;background:var(--ink);color:var(--ink);
  font-family:'Crimson Pro',Georgia,serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent}


/* ================================================================
   BACKGROUND — Mandala / Rangoli
================================================================ */
.bg-layer{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:radial-gradient(ellipse at 50% 0%,rgba(212,175,55,0.18) 0%,transparent 60%),
  radial-gradient(ellipse at 0% 100%,rgba(128,0,32,0.2) 0%,transparent 50%),
  radial-gradient(ellipse at 100% 100%,rgba(255,153,51,0.12) 0%,transparent 50%),#1A0800}
.bg-layer::before{content:'';position:absolute;inset:0;
  background-image:
    repeating-linear-gradient(0deg,rgba(212,175,55,0.035) 0,transparent 1px,transparent 44px,rgba(212,175,55,0.035) 45px),
    repeating-linear-gradient(90deg,rgba(212,175,55,0.035) 0,transparent 1px,transparent 44px,rgba(212,175,55,0.035) 45px)}
/* Animated mandala rings */
.bg-layer::after{content:'';position:absolute;width:1000px;height:1000px;top:50%;left:50%;
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:
    radial-gradient(circle at 50% 50%,
      transparent 30%,rgba(212,175,55,0.055) 31%,transparent 32%,
      transparent 38%,rgba(212,175,55,0.045) 39%,transparent 40%,
      transparent 46%,rgba(212,175,55,0.035) 47%,transparent 48%,
      transparent 54%,rgba(212,175,55,0.025) 55%,transparent 56%);
  animation:mandala-spin 90s linear infinite}
@keyframes mandala-spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

/* SVG Rangoli dots overlay */
.rangoli-svg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.07}

/* ── CORNER DECORATIONS ── */
.corner-decor{position:fixed;width:110px;height:110px;opacity:0.16;z-index:1;pointer-events:none}
.corner-decor.tl{top:0;left:0}.corner-decor.tr{top:0;right:0;transform:scaleX(-1)}
.corner-decor.bl{bottom:48px;left:0;transform:scaleY(-1)}.corner-decor.br{bottom:48px;right:0;transform:scale(-1,-1)}

/* ================================================================
   HEADER
================================================================ */
.header{position:relative;z-index:10;text-align:center;padding:1.3rem 1rem 0.7rem;
  border-bottom:1px solid rgba(212,175,55,0.22)}
.header-ornament{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:0.25rem;color:var(--gold)}
.ornament-line{height:1px;width:55px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.header h1{font-family:'Cinzel',serif;font-size:clamp(1.3rem,3.5vw,2.4rem);font-weight:700;
  color:var(--gold-lt);letter-spacing:0.07em;text-shadow:0 2px 20px rgba(212,175,55,0.4);transition:all 0.3s}
.header-sub{font-family:'Noto Serif',serif;font-size:0.74rem;color:var(--saffron-lt);
  letter-spacing:0.15em;text-transform:uppercase;margin-top:0.2rem;opacity:0.8}

/* Last updated badge */
.last-updated{position:absolute;top:0.6rem;right:0.8rem;font-size:0.62rem;
  color:rgba(212,175,55,0.5);font-family:'Noto Serif',serif;letter-spacing:0.04em;
  background:rgba(26,8,0,0.5);border:1px solid rgba(212,175,55,0.15);
  border-radius:4px;padding:0.18rem 0.5rem;backdrop-filter:blur(4px);
  white-space:nowrap}
@media(max-width:480px){.last-updated{position:static;display:block;text-align:center;margin-top:0.3rem}}

/* ================================================================
   SEARCH BAR
================================================================ */
.search-wrap{position:relative;z-index:20;display:flex;align-items:center;justify-content:center;
  gap:0.5rem;padding:0.55rem 1rem;border-bottom:1px solid rgba(212,175,55,0.12);flex-wrap:wrap}
.search-box{position:relative;max-width:340px;width:100%}
.search-box input{width:100%;padding:0.42rem 2.4rem 0.42rem 0.85rem;
  background:rgba(26,8,0,0.75);border:1px solid rgba(212,175,55,0.35);
  border-radius:20px;color:var(--cream);font-family:'Crimson Pro',serif;font-size:0.84rem;
  outline:none;transition:border-color .2s,box-shadow .2s;backdrop-filter:blur(6px)}
.search-box input:focus{border-color:var(--gold);box-shadow:0 0 12px rgba(212,175,55,0.25)}
.search-box input::placeholder{color:rgba(212,175,55,0.38);font-style:italic}
.search-clear{position:absolute;right:0.55rem;top:50%;transform:translateY(-50%);
  background:none;border:none;color:rgba(212,175,55,0.5);cursor:pointer;
  font-size:0.9rem;line-height:1;padding:0.15rem;transition:color .15s}
.search-clear:hover{color:var(--gold)}
/* Search suggestions dropdown */
.search-suggestions{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:100;
  background:#2C1200;border:1px solid rgba(212,175,55,0.35);border-radius:8px;
  overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.5);max-height:200px;overflow-y:auto}
.search-sug-item{padding:0.45rem 0.85rem;font-size:0.78rem;color:var(--cream-dk);
  cursor:pointer;border-bottom:1px solid rgba(212,175,55,0.1);transition:background .15s;
  display:flex;flex-direction:column;gap:2px}
.search-sug-item:last-child{border-bottom:none}
.search-sug-item:hover{background:rgba(212,175,55,0.12)}
.search-sug-item .sug-name{font-weight:500;color:var(--gold-lt);font-size:0.8rem}
.search-sug-item .sug-meta{font-size:0.66rem;color:var(--muted);font-style:italic}

/* ================================================================
   TOOLBAR
================================================================ */
.toolbar{position:relative;z-index:10;display:flex;align-items:center;justify-content:center;
  gap:0.45rem;flex-wrap:wrap;padding:0.5rem 0.8rem;border-bottom:1px solid rgba(212,175,55,0.12)}
.btn{font-family:'Cinzel',serif;font-size:0.66rem;letter-spacing:0.08em;
  padding:0.38rem 0.9rem;border-radius:4px;border:1px solid rgba(212,175,55,0.38);
  background:rgba(26,8,0,0.7);color:var(--gold-lt);cursor:pointer;
  transition:all var(--transition-speed);backdrop-filter:blur(4px);
  -webkit-tap-highlight-color:transparent;min-height:36px;touch-action:manipulation}
.btn:hover,.btn:active{background:rgba(212,175,55,0.14);border-color:var(--gold);
  box-shadow:0 0 10px rgba(212,175,55,0.22)}
.btn-primary{background:linear-gradient(135deg,var(--maroon) 0%,var(--maroon-lt) 100%);
  border-color:var(--saffron);color:var(--cream)}
.btn-primary:hover{background:linear-gradient(135deg,var(--maroon-lt) 0%,var(--saffron-dk) 100%);
  box-shadow:0 0 16px rgba(255,153,51,0.35)}
.btn-danger{background:rgba(128,0,32,0.3);border-color:rgba(255,100,80,0.4);color:#ffaaaa}
.btn-danger:hover{background:rgba(128,0,32,0.5)}

/* Language toggle pill */
.lang-toggle{display:inline-flex;align-items:center;border-radius:20px;overflow:hidden;
  border:1px solid rgba(212,175,55,0.45);background:rgba(26,8,0,0.8)}
.lang-opt{padding:0.35rem 0.8rem;font-size:0.68rem;cursor:pointer;color:rgba(240,208,96,0.55);
  font-family:'Cinzel',serif;letter-spacing:0.07em;border:none;background:transparent;
  transition:all .2s;min-height:34px;touch-action:manipulation}
.lang-opt.active{background:linear-gradient(135deg,var(--maroon),var(--maroon-lt));
  color:var(--cream);font-weight:600}
.lang-opt:first-child{border-right:1px solid rgba(212,175,55,0.2)}

/* You-bar */
.you-bar{position:relative;z-index:10;text-align:center;padding:0.28rem 1rem;
  background:rgba(255,153,51,0.1);border-bottom:1px solid rgba(255,153,51,0.2);
  font-size:0.72rem;color:var(--saffron-lt);letter-spacing:0.03em;display:none}
.you-bar b{color:var(--gold-lt)}
.hint-bar{position:relative;z-index:10;text-align:center;padding:0.18rem;
  font-size:0.64rem;color:rgba(212,175,55,0.3);letter-spacing:0.05em}

/* ================================================================
   3D STAGE
================================================================ */
.shell{position:relative;z-index:5;display:flex;flex-direction:column;height:100vh;height:100dvh;padding-bottom:38px}
.stage{position:relative;z-index:5;flex:1 1 auto;min-height:400px;overflow:hidden;cursor:grab;
  touch-action:none;user-select:none;-webkit-user-select:none;
  background:radial-gradient(ellipse at 50% 40%,rgba(212,175,55,0.08),transparent 62%)}
.stage.dragging{cursor:grabbing}
#edges{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#nodes{position:absolute;left:0;top:0;width:100%;height:100%}

/* ── Family card (one per couple / person) ── */
.u-card{position:absolute;left:0;top:0;display:none;min-width:92px;max-width:138px;padding:2px;
  border-radius:10px;background:var(--node-bg);border:1.5px solid var(--node-border);
  box-shadow:0 3px 12px var(--shadow-warm),inset 0 1px 0 rgba(255,255,255,0.75);
  cursor:pointer;text-align:center;transform-origin:50% 50%}
.u-card::before{content:'';position:absolute;inset:-1px;border-radius:10px;pointer-events:none;
  background:linear-gradient(135deg,rgba(212,175,55,0.28) 0%,transparent 55%,rgba(255,153,51,0.12) 100%)}
.u-card:hover{border-color:var(--saffron);box-shadow:0 6px 22px rgba(180,100,0,0.4),inset 0 1px 0 rgba(255,255,255,0.9)}
.u-card.on-path{border-color:var(--path-color);
  box-shadow:0 0 0 2px rgba(255,215,0,0.45),0 0 20px rgba(255,215,0,0.55)}
.u-card.has-you{border-color:var(--saffron);animation:you-pulse 2.8s ease-in-out infinite}
.u-card.has-hit{border-color:var(--gold-lt)}
@keyframes you-pulse{
  0%,100%{box-shadow:0 0 0 3px rgba(255,153,51,0.25),0 0 20px rgba(255,153,51,0.5)}
  50%{box-shadow:0 0 0 6px rgba(255,153,51,0.1),0 0 40px rgba(255,153,51,0.85)}}
.u-card.dimmed{filter:grayscale(60%)}

.u-row{position:relative;padding:0.3rem 0.6rem 0.26rem;border-radius:7px}
.u-row+.u-row{margin-top:2px}
.u-row+.u-row::before{content:'✦';position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  font-size:7px;line-height:1;color:var(--gold-dk);background:var(--node-bg);padding:0 3px;z-index:1}
.u-row+.u-row{border-top:1px solid rgba(160,120,32,0.45)}
.u-name{display:block;font-family:'Crimson Pro',serif;font-weight:500;font-size:0.78rem;
  color:var(--ink);line-height:1.25;word-break:break-word}
.u-name.you-nm{color:var(--maroon);font-weight:700}
.u-rel{display:block;font-family:'Cinzel',serif;font-size:0.54rem;letter-spacing:0.05em;
  color:var(--maroon-lt);margin-top:2px;line-height:1.3}
.u-rel.rel-you{color:var(--maroon-dk);font-weight:700;background:rgba(255,153,51,0.22);
  border-radius:3px;padding:1px 4px}
.u-row.on-path{background:linear-gradient(155deg,#FFFAE8 0%,#FFE9A0 100%)}
.u-row.search-hit{background:linear-gradient(155deg,#FFFFF0 0%,#FFEDAA 100%);
  box-shadow:0 0 0 2px rgba(255,215,0,0.6),0 0 18px rgba(255,215,0,0.7)}
.u-row.is-you{background:linear-gradient(155deg,#FFFCE0 0%,#FFE89A 100%);
  box-shadow:0 0 0 2px rgba(255,153,51,0.55),0 0 18px var(--glow-you)}

/* expand / collapse badge */
.u-tog{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);width:19px;height:19px;
  border-radius:50%;background:radial-gradient(circle,var(--cream) 60%,var(--cream-dk) 100%);
  border:1px solid var(--gold-dk);color:var(--maroon);font:700 12px/17px monospace;text-align:center;
  cursor:pointer;box-shadow:0 1px 4px rgba(180,100,0,0.3);z-index:3}
.u-tog:hover{background:radial-gradient(circle,var(--saffron-lt) 60%,var(--saffron) 100%);border-color:var(--saffron)}

/* ── Bloodline bar ── */
.yb-chain{display:flex;flex-wrap:wrap;gap:4px 3px;justify-content:center;align-items:center;margin-top:0.3rem}
.chip{padding:0.1rem 0.55rem;border-radius:12px;border:1px solid rgba(255,215,0,0.4);
  background:rgba(255,215,0,0.08);color:var(--gold-lt);cursor:pointer;font-size:0.7rem;
  transition:background .15s}
.chip:hover{background:rgba(255,215,0,0.2)}
.chip.last{background:rgba(255,153,51,0.28);border-color:var(--saffron);color:var(--cream)}
.chip-arrow{color:rgba(255,215,0,0.5);font-size:0.7rem}
.yb-stats{margin-top:0.2rem;font-size:0.64rem;color:rgba(255,215,160,0.6)}

/* ================================================================
   MODAL
================================================================ */
.modal-overlay{position:fixed;inset:0;z-index:999;background:rgba(10,2,0,0.82);
  display:flex;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(6px)}
.modal{background:linear-gradient(160deg,#2C1200 0%,#1A0800 100%);
  border:1px solid rgba(212,175,55,0.4);border-radius:12px;padding:1.8rem;
  width:100%;max-width:420px;max-height:90vh;overflow-y:auto;
  box-shadow:0 0 0 1px rgba(255,153,51,0.1),0 24px 60px rgba(0,0,0,0.6);
  position:relative;overflow:hidden}
.modal::before{content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 0% 0%,rgba(212,175,55,0.07) 0%,transparent 60%),
  radial-gradient(circle at 100% 100%,rgba(255,153,51,0.05) 0%,transparent 50%);pointer-events:none}
.modal h2{font-family:'Cinzel',serif;font-size:1.2rem;color:var(--gold-lt);
  margin-bottom:0.35rem;letter-spacing:0.05em}
.modal p{font-size:0.79rem;color:rgba(255,220,150,0.62);margin-bottom:1.2rem;line-height:1.6}
.fgrp{margin-bottom:0.85rem}
.fgrp label{display:block;font-family:'Cinzel',serif;font-size:0.6rem;
  letter-spacing:0.1em;color:var(--saffron-lt);margin-bottom:0.28rem;text-transform:uppercase}
.fgrp input,.fgrp select{width:100%;padding:0.48rem 0.78rem;background:rgba(0,0,0,0.4);
  border:1px solid rgba(212,175,55,0.33);border-radius:6px;color:var(--cream);
  font-family:'Crimson Pro',serif;font-size:0.86rem;outline:none;
  transition:border-color .18s,box-shadow .18s}
.fgrp input:focus,.fgrp select:focus{border-color:var(--saffron);
  box-shadow:0 0 10px rgba(255,153,51,0.2)}
.fgrp select option{background:#2C1200}
.modal-err{font-size:0.73rem;color:#ffaaaa;margin-top:0.35rem;min-height:1.1em}
.modal-divider{width:100%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(212,175,55,0.3),transparent);margin:0.9rem 0}
.modal-footer{display:flex;gap:0.6rem;justify-content:flex-end;margin-top:1rem}

/* ================================================================
   TIMELINE (bottom marquee)
================================================================ */
.timeline-wrap{position:fixed;bottom:0;left:0;right:0;z-index:50;height:38px;
  background:linear-gradient(90deg,var(--maroon-dk) 0%,#3D0010 30%,#3D0010 70%,var(--maroon-dk) 100%);
  border-top:1px solid rgba(212,175,55,0.32);overflow:hidden;display:flex;align-items:center}
.timeline-wrap::before,.timeline-wrap::after{content:'';position:absolute;top:0;bottom:0;width:70px;z-index:2}
.timeline-wrap::before{left:0;background:linear-gradient(90deg,#200008,transparent)}
.timeline-wrap::after{right:0;background:linear-gradient(270deg,#200008,transparent)}
.timeline-track{display:flex;align-items:center;white-space:nowrap;
  animation:scroll-rtl 34s linear infinite;will-change:transform}
.timeline-track:hover{animation-play-state:paused}
@keyframes scroll-rtl{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.timeline-seg{display:inline-flex;align-items:center;gap:14px;padding:0 32px}
.timeline-gem{display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 6px rgba(212,175,55,0.6);flex-shrink:0}
.timeline-text{font-family:'Crimson Pro',serif;font-size:0.78rem;font-style:italic;
  color:rgba(253,240,180,0.82);letter-spacing:0.03em}
.timeline-text b{font-style:normal;font-weight:600;color:var(--gold-lt)}
body.lang-te .timeline-text{font-family:'Noto Serif Telugu',serif;font-style:normal;font-size:0.76rem}

/* ================================================================
   ZOOM CONTROLS
================================================================ */
.zoom-indicator{position:fixed;bottom:46px;right:10px;z-index:40;
  display:flex;flex-direction:column;gap:4px;align-items:center}
.zoom-btn{width:28px;height:28px;border-radius:50%;
  background:rgba(40,15,0,0.85);border:1px solid rgba(212,175,55,0.35);
  color:var(--gold-lt);font-size:1rem;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
  backdrop-filter:blur(4px);font-family:monospace;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.zoom-btn:hover,.zoom-btn:active{background:rgba(212,175,55,0.2);border-color:var(--gold);
  box-shadow:0 0 10px rgba(212,175,55,0.3)}
.zoom-label{font-family:'Cinzel',serif;font-size:0.55rem;
  color:rgba(212,175,55,0.5);letter-spacing:0.07em}

/* ================================================================
   LEGEND
================================================================ */
.legend{position:fixed;bottom:46px;left:10px;z-index:40;display:flex;flex-direction:column;
  gap:5px;background:rgba(20,5,0,0.78);border:1px solid rgba(212,175,55,0.18);
  border-radius:8px;padding:0.42rem 0.72rem;backdrop-filter:blur(4px)}
.leg-item{display:flex;align-items:center;gap:6px;font-size:0.61rem;
  color:rgba(253,240,180,0.58);font-family:'Noto Serif',serif}
.leg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

.zoom-btn.on{background:rgba(212,175,55,0.3);border-color:var(--gold);color:var(--cream)}
.zoom-btn.sm{font-size:0.8rem}

/* ================================================================
   MOBILE
================================================================ */
@media(max-width:600px){
  .header h1{font-size:1.3rem}
  .toolbar{gap:0.3rem;padding:0.4rem 0.5rem}
  .btn{font-size:0.6rem;padding:0.35rem 0.65rem;min-height:34px}
  .lang-opt{padding:0.3rem 0.6rem;font-size:0.62rem}
  .stage{min-height:460px}
  .u-name{font-size:0.7rem}
  .u-rel{font-size:0.5rem}
  .legend{display:none}
  .last-updated{font-size:0.58rem}
  .search-box{max-width:100%}
  .yb-chain .chip{font-size:0.64rem;padding:0.08rem 0.45rem}
}
@media(max-width:380px){.btn{font-size:0.56rem;padding:0.3rem 0.55rem}}
@media(prefers-reduced-motion:reduce){
  .bg-layer::after,.timeline-track,.u-card.has-you{animation:none}
}

/* ================================================================
   TELUGU MODE — proper shaping: no letter-spacing, no forced caps,
   a real Telugu font on EVERYTHING (names, cards, modal, inputs)
================================================================ */
body.lang-te,
body.lang-te *{
  font-family:'Noto Serif Telugu','Noto Sans Telugu','Nirmala UI','Gautami','Vani','Telugu Sangam MN',serif;
  letter-spacing:0 !important;text-transform:none !important;font-style:normal}
body.lang-te .u-name{font-size:0.8rem;line-height:1.5;font-weight:500}
body.lang-te .u-name.you-nm{font-weight:700}
body.lang-te .u-rel{font-size:0.62rem;line-height:1.5}
body.lang-te .header h1{line-height:1.35}
body.lang-te .header-sub{font-size:0.8rem}
body.lang-te .btn{font-size:0.74rem;line-height:1.4}
body.lang-te .lang-opt{font-size:0.74rem}
body.lang-te .fgrp label{font-size:0.72rem}
body.lang-te .modal p,body.lang-te .you-bar,body.lang-te .hint-bar,body.lang-te .leg-item{line-height:1.6}
body.lang-te .zoom-btn,body.lang-te .u-tog{font-family:monospace}
body.lang-te .timeline-text{font-size:0.8rem}

const G = {}; // id → person node

function mkId(){ return 'N'+(++_uid); }

function person(name, gender){
  const id = mkId();
  G[id] = { id, name, gender:gender||'m', fatherId:null, motherId:null, spouseId:null, childrenIds:[] };
  return id;
}
function marry(aId, bId){
  if(!aId||!bId) return;
  G[aId].spouseId = bId; G[bId].spouseId = aId;
}
function addChildren(parentId, spouseId, childIds){
  if(parentId && G[parentId]) G[parentId].childrenIds = childIds;
  childIds.forEach(cId => {
    if(!G[cId]) return;
    const pg = G[parentId];
    if(pg){
      if(pg.gender==='m'){ G[cId].fatherId=parentId; if(spouseId) G[cId].motherId=spouseId; }
      else               { G[cId].motherId=parentId; if(spouseId) G[cId].fatherId=spouseId; }
    }
  });
}

/* ================================================================
   MODULE: RELATIONSHIP ENGINE — BFS + LCA
================================================================ */
/** BFS upward: returns Map<id, depth> for all ancestors */
function ancestorMap(id){
  const dist = new Map();
  const q = [[id, 0]];
  while(q.length){
    const [cur, d] = q.shift();
    if(dist.has(cur)) continue;
    dist.set(cur, d);
    const p = G[cur]; if(!p) continue;
    if(p.fatherId) q.push([p.fatherId, d+1]);
    if(p.motherId) q.push([p.motherId, d+1]);
  }
  return dist;
}

/** Find Lowest Common Ancestor between two IDs */
function findLCA(aId, bId){
  const ancsA = ancestorMap(aId);
  const ancsB = ancestorMap(bId);
  let best = null;
  ancsA.forEach((dA, node) => {
    if(ancsB.has(node)){
      const dB = ancsB.get(node), total = dA + dB;
      if(!best || total < best.total || (total === best.total && dA < best.dA))
        best = { lca: node, dA, dB, total };
    }
  });
  return best;
}

/** Returns the full ancestor path from id up to ancestorId */
function getPathToAncestor(id, ancestorId){
  const path = [id];
  let cur = id;
  while(cur !== ancestorId){
    const p = G[cur];
    if(!p) break;
    // Prefer father path, fall back to mother
    let next = null;
    if(p.fatherId && G[p.fatherId]){
      const am = ancestorMap(ancestorId);
      // Walk whichever parent leads toward ancestorId
      const viaFather = ancestorMap(p.fatherId).has(ancestorId) || p.fatherId === ancestorId;
      const viaMother = p.motherId && (ancestorMap(p.motherId).has(ancestorId) || p.motherId === ancestorId);
      if(viaFather) next = p.fatherId;
      else if(viaMother) next = p.motherId;
      else next = p.fatherId;
    } else if(p.motherId){
      next = p.motherId;
    } else break;
    if(path.includes(next)) break;
    path.push(next);
    cur = next;
  }
  return path;
}

function ordinal(n){ const s=['th','st','nd','rd'],v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }

const baseKey = k => (k || '').split('|')[0];
const greats  = k => k <= 2 ? 'Great-'.repeat(k) : `${k}× Great-`;

/** Compute relationship key (language-neutral) between youId → targetId.
    Suffixes: |p / |m = via father's / mother's side, |b / |s = via brother / sister */
function computeRelKey(youId, targetId, seen){
  if(!youId || !targetId) return null;
  if(youId === targetId) return 'You';
  const you = G[youId], tgt = G[targetId];
  if(!you || !tgt) return null;
  seen = seen || new Set();
  if(seen.has(targetId)) return null;          // guards the in-law recursion
  seen.add(targetId);
  const f = tgt.gender === 'f';

  if(you.spouseId === targetId) return f ? 'Wife' : 'Husband';

  const lca = findLCA(youId, targetId);

  if(!lca){
    // a) target is the spouse of someone related to you
    const partner = Object.values(G).find(p => p.spouseId === targetId);
    if(partner){
      const pRel = baseKey(computeRelKey(youId, partner.id, seen));
      if(pRel==='Father'||pRel==='Mother')           return f?'MotherInLaw':'FatherInLaw';
      if(pRel==='Son'||pRel==='Daughter')             return f?'DaughterInLaw':'SonInLaw';
      if(pRel==='Brother'||pRel==='Sister')           return f?'SisterInLaw':'BrotherInLaw';
      if(pRel==='Uncle'||pRel==='Aunt')               return f?'AuntMarriage':'UncleMarriage';
      if(pRel && pRel.includes('Cousin'))             return 'CousinSpouse';
      if(pRel==='Grandson'||pRel==='Granddaughter')   return f?'GranddaughterInLaw':'GrandsonInLaw';
    }
    // b) you married into the family: read the relation through your spouse
    if(you.spouseId && !seen.has('__viaSpouse')){
      const sRel = baseKey(computeRelKey(you.spouseId, targetId, new Set(['__viaSpouse'])));
      if(sRel==='Father')  return 'FatherInLaw';
      if(sRel==='Mother')  return 'MotherInLaw';
      if(sRel==='Brother') return 'BrotherInLaw';
      if(sRel==='Sister')  return 'SisterInLaw';
    }
    return null;
  }

  const { dA, dB } = lca;
  const sideOf = () => { const path = getPathToAncestor(youId, lca.lca); return (G[path[1]] && G[path[1]].gender === 'f') ? '|m' : '|p'; };

  if(dA===0){                                   // target is your descendant
    if(dB===1) return f?'Daughter':'Son';
    if(dB===2) return f?'Granddaughter':'Grandson';
    if(dB===3) return f?'GreatGranddaughter':'GreatGrandson';
    return `Desc_${dB}_${f?'d':'s'}`;
  }
  if(dB===0){                                   // target is your ancestor
    if(dA===1) return f?'Mother':'Father';
    if(dA===2) return (f?'Grandmother':'Grandfather') + sideOf();
    if(dA===3) return f?'GreatGrandmother':'GreatGrandfather';
    return `Anc_${dA}_${f?'m':'f'}`;
  }
  if(dA===1&&dB===1) return f?'Sister':'Brother';
  if(dA===2&&dB===1) return (f?'Aunt':'Uncle') + sideOf();
  if(dA===1&&dB===2){
    const pathB = getPathToAncestor(targetId, lca.lca);
    const sib = G[pathB[1]];
    return (f?'Niece':'Nephew') + (sib && sib.gender==='f' ? '|s' : '|b');
  }
  if(dA===3&&dB===1) return f?'GrandAunt':'GrandUncle';
  if(dA===1&&dB===3) return f?'GrandNiece':'GrandNephew';
  if(dA>=4&&dB===1)  return `GU_${dA-3}_${f?'a':'u'}`;
  if(dA===1&&dB>=4)  return `GN_${dB-3}_${f?'a':'u'}`;
  if(dA===dB){ const n=dA-1; return n===1?'Cousin':`Cousin${n}`; }
  const minD=Math.min(dA,dB), removed=Math.abs(dA-dB), n=minD-1;
  return `Cousin${n>1?n:'1'}_rem${removed}`;
}

/** Translate a relationship key to display string in current language */
function relLabel(key){
  if(!key) return '';
  const te = lang === 'te';
  let m;
  if((m = key.match(/^(Anc|Desc)_(\d+)_([a-z])$/))){
    const d = parseInt(m[2]);
    if(m[1]==='Anc'){
      return te ? `${d}వ తరం పూర్వీకులు`
                : greats(d-2) + (m[3]==='m' ? 'Grandmother' : 'Grandfather');
    }
    return te ? `${d}వ తరం వారసులు`
              : greats(d-2) + (m[3]==='d' ? 'Granddaughter' : 'Grandson');
  }
  if((m = key.match(/^(GU|GN)_(\d+)_([au])$/))){
    const k = parseInt(m[2]), a = m[3]==='a';
    if(m[1]==='GU') return te ? `${t(a?'GrandAunt':'GrandUncle')} (${k} తరం పైన)` : greats(k)+(a?'Grand-Aunt':'Grand-Uncle');
    return te ? `${t(a?'GrandNiece':'GrandNephew')} (${k} తరం కింద)` : greats(k)+(a?'Grand-Niece':'Grand-Nephew');
  }
  if(key.startsWith('Cousin')){
    const remM = key.match(/^Cousin(\d*)_rem(\d+)$/);
    if(remM){
      const n = parseInt(remM[1])||1, r = parseInt(remM[2]);
      return te ? `${n}వ కజిన్ (${r} తరం తేడా)` : `${ordinal(n)} Cousin (${r}× removed)`;
    }
    const nM = key.match(/^Cousin(\d+)$/);
    if(nM){ const n = parseInt(nM[1]); return te ? `${n}వ కజిన్` : `${ordinal(n)} Cousin`; }
    return t('Cousin');
  }
  if(te && TE_SIDE[key]) return TE_SIDE[key];
  return t(baseKey(key));
}

/** Build full relMap: id → relationship key */
function buildRelMap(youId){
  const map = {};
  Object.keys(G).forEach(id => {
    const k = computeRelKey(youId, id);
    if(k) map[id] = k;
  });
  return map;
}

/* ================================================================
   MODULE: STATE
================================================================ */
let youId       = null;      // selected "you" person ID
let relMap      = {};        // id → relationship key
let collapsed   = {};        // id → true if collapsed
let pathSet     = new Set(); // IDs on the bloodline
let searchHitId = null;      // single search result / clicked person
let dimMode     = false;     // true while a bloodline is highlighted
let bloodId     = null;      // person whose bloodline is shown
let bloodStats  = {anc:0, desc:0};

/* ================================================================
   MODULE: 3D TREE MODEL (units = person + spouse)
================================================================ */
const ROOT = P_Veraiah;
const U = {};        // unit id → unit  (unit id = the blood-line person's id)
const BLOOD = new Set();
const unitOf = {};   // any person id → unit id
const RSTEP = 280, YSTEP = 125, TAU = Math.PI*2, CAMZ = 6500, PITCH0 = 0.15;
let maxD = 0;

(function buildUnits(){
  (function walk(id, parent, depth){
    const p = G[id];
    BLOOD.add(id);
    U[id] = { id, sp:p.spouseId||null, parent, kids:[], depth, t:null, cur:null, alpha:0, shown:true, el:null, dim:false };
    unitOf[id] = id; if(p.spouseId) unitOf[p.spouseId] = id;
    (p.childrenIds||[]).forEach(c => { if(G[c]){ U[id].kids.push(c); walk(c, U[id], depth+1); } });
  })(ROOT, null, 0);
})();

function kidsVis(u){ return collapsed[u.id] ? [] : u.kids.map(k => U[k]); }
function wt(u){ const ks = kidsVis(u); return ks.length ? ks.reduce((s,k) => s + wt(k), 0) : 1; }

/** Cone layout: every branch gets an angular sector sized by how many people it holds. */
function relayout(){
  let idx = 0; maxD = 0;
  function hide(u, pt){ u.shown = false; u.t = {r:pt.r, th:pt.th, y:pt.y}; u.kids.forEach(k => hide(U[k], pt)); }
  function place(u, a0, a1){
    u.shown = true;
    const th = (a0+a1)/2;
    const jitter = u.depth ? ((idx++ % 3) - 1) * 34 : 0;   // stagger neighbours so cards don't overlap
    u.t = { r:u.depth*RSTEP, th, y:u.depth*YSTEP + jitter };
    maxD = Math.max(maxD, u.depth);
    const ks = kidsVis(u);
    if(ks.length){
      const tot = ks.reduce((s,k) => s + wt(k), 0);
      let a = a0;
      ks.forEach(k => { const w = wt(k)/tot*(a1-a0); place(k, a, a+w); a += w; });
    }
    if(collapsed[u.id]) u.kids.forEach(k => hide(U[k], u.t));
  }
  place(U[ROOT], 0, TAU);
  tgt.cy = (maxD*YSTEP)/2;
  Object.values(U).forEach(u => { if(!u.cur) u.cur = {r:0, th:u.t.th, y:0}; });
  markDirty();
}

/* ================================================================
   MODULE: CAMERA + PROJECTION
================================================================ */
const cam = { yaw:-0.9, pitch:PITCH0, zoom:0.3, panX:0, panY:0, cy:300 };
const tgt = { yaw:0,    pitch:PITCH0, zoom:0.6, panX:0, panY:0, cy:300 };
let W = 800, H = 600, dpr = 1;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

function project(r, th, y, c){
  const x = r*Math.sin(th), z = r*Math.cos(th), yy = y - c.cy;
  const cyw = Math.cos(c.yaw), syw = Math.sin(c.yaw);
  const x1 = x*cyw + z*syw, z1 = -x*syw + z*cyw;
  const cp = Math.cos(c.pitch), sp = Math.sin(c.pitch);
  const y2 = yy*cp + z1*sp, z2 = -yy*sp + z1*cp;
  const s = CAMZ/(CAMZ - z2);
  return { sx: W/2 + c.panX + x1*s*c.zoom, sy: H/2 + c.panY + y2*s*c.zoom, z:z2, s:s*c.zoom };
}

/** Size the model to the screen using its real projected extent (sampled over a full turn) */
function modelFit(pitch){
  const xs = [], ys = [], cy = (maxD*YSTEP)/2;
  const vis = Object.values(U).filter(u => u.shown);
  for(let k = 0; k < 12; k++){
    const c = { yaw:k*Math.PI/6, pitch, zoom:1, panX:0, panY:0, cy };
    vis.forEach(u => { const p = project(u.t.r, u.t.th, u.t.y, c); xs.push(Math.abs(p.sx - W/2)); ys.push(p.sy - H/2); });
  }
  xs.sort((a,b) => a-b); ys.sort((a,b) => a-b);
  const at = (a,q) => a[Math.floor(q*(a.length-1))];
  const px = Math.max(at(xs,0.9), 70), lo = at(ys,0.04), hi = at(ys,0.96);
  const zoom = clamp(Math.min(W*0.96/(2*px), H*0.94/Math.max(hi-lo, 120)), W < 700 ? 0.42 : 0.3, 1.1);
  return { zoom, panY: -(lo+hi)/2*zoom };
}
function fitView(){
  const f = modelFit(PITCH0);
  tgt.zoom = f.zoom; tgt.panX = 0; tgt.panY = f.panY; tgt.pitch = PITCH0; markDirty();
}

/** Rotate the whole tree so a person's card faces you, centre it, and zoom in a little */
function focusUnit(uid){
  const u = U[uid]; if(!u || !u.t) return;
  let ty = -u.t.th; ty += Math.round((cam.yaw - ty)/TAU)*TAU;   // shortest way round
  tgt.yaw = ty;
  tgt.pitch = 0.2;
  tgt.zoom = clamp(0.95*(CAMZ - u.t.r*0.95)/CAMZ, 0.5, 0.85);
  const p = project(u.t.r, u.t.th, u.t.y, { yaw:tgt.yaw, pitch:tgt.pitch, zoom:tgt.zoom, panX:0, panY:0, cy:tgt.cy });
  tgt.panX = -(p.sx - W/2); tgt.panY = -(p.sy - H/2) + H*0.1;   // keep the ancestors above in view
  setAuto(false); markDirty();
}
function focusPerson(pid){ focusUnit(unitOf[pid]); }

/* ================================================================
   MODULE: CARDS (DOM)
================================================================ */
const nodesEl = document.getElementById('nodes');
const stageEl = document.getElementById('stage');

function buildCards(){
  Object.values(U).forEach(u => {
    const el = document.createElement('div');
    el.className = 'u-card'; el.dataset.uid = u.id;
    nodesEl.appendChild(el); u.el = el;
  });
}
function rowCls(pid){
  let c = 'u-row';
  if(pid === youId) c += ' is-you';
  if(pid === searchHitId) c += ' search-hit';
  if(pathSet.has(pid) && pid !== youId) c += ' on-path';
  return c;
}
function rowHTML(pid){
  const key = relMap[pid];
  const rel = key ? relLabel(key) : '';
  const isYou = pid === youId;
  return `<div class="${rowCls(pid)}" data-pid="${pid}"><span class="u-name${isYou?' you-nm':''}">${nm(pid)}</span>${rel?`<span class="u-rel${isYou?' rel-you':''}">${rel}</span>`:''}</div>`;
}
function updateCards(){
  Object.values(U).forEach(u => {
    const ids = u.sp ? [u.id, u.sp] : [u.id];
    const onPath = ids.some(i => pathSet.has(i));
    u.dim = dimMode && !ids.some(i => pathSet.has(i) || i === youId || i === searchHitId);
    u.hot = onPath || ids.includes(youId) || ids.includes(searchHitId);
    u.el.className = 'u-card' + (onPath?' on-path':'') + (ids.includes(youId)?' has-you':'') +
                     (ids.includes(searchHitId)?' has-hit':'') + (u.dim?' dimmed':'');
    u.el.innerHTML = ids.map(rowHTML).join('') +
      (u.kids.length ? `<div class="u-tog" data-tog="${u.id}">${collapsed[u.id]?'+':'&minus;'}</div>` : '');
  });
  markDirty();
}

let dragDist = 0;
nodesEl.addEventListener('click', e => {
  if(dragDist > 6) return;
  const tog = e.target.closest('[data-tog]');
  if(tog){ togNode(tog.dataset.tog); return; }
  const row = e.target.closest('[data-pid]');
  if(row) selectPerson(row.dataset.pid);
});

/* ================================================================
   MODULE: BLOODLINE
================================================================ */
function kidsOwner(id){
  const p = G[id];
  if(p.childrenIds && p.childrenIds.length) return id;
  return (p.spouseId && G[p.spouseId].childrenIds && G[p.spouseId].childrenIds.length) ? p.spouseId : id;
}

/** ancestors + descendants + their spouses = the person's bloodline */
function computeBloodline(pid){
  const s = new Set([pid]);
  const anc = ancestorMap(pid);
  anc.forEach((d, id) => s.add(id));
  let descCount = 0;
  (function addDesc(id){
    const p = G[id]; if(!p || !p.childrenIds) return;
    p.childrenIds.forEach(c => { s.add(c); descCount++; addDesc(c); });
  })(kidsOwner(pid));
  const extras = [];
  s.forEach(id => { if(G[id] && G[id].spouseId) extras.push(G[id].spouseId); });
  extras.forEach(id => s.add(id));
  pathSet = s; dimMode = true; bloodId = pid;
  bloodStats = { anc: anc.size - 1, desc: descCount };
}

/** chain of people from the family root down to this person */
function chainOf(pid){
  const out = []; let cur = pid, guard = 0;
  while(cur && guard++ < 30){
    out.unshift(cur);
    const p = G[cur]; let nxt = null;
    if(p.fatherId && BLOOD.has(p.fatherId)) nxt = p.fatherId;
    else if(p.motherId && BLOOD.has(p.motherId)) nxt = p.motherId;
    else if(!BLOOD.has(cur) && p.spouseId && BLOOD.has(p.spouseId)) nxt = p.spouseId;
    cur = nxt;
  }
  return out;
}

function expandFor(pid){
  const uid = unitOf[pid]; if(!uid) return;
  let u = U[uid];
  while(u.parent){ collapsed[u.parent.id] = false; u = u.parent; }
  (function ex(x){ collapsed[x.id] = false; x.kids.forEach(k => ex(U[k])); })(U[uid]);
}

/** Pick a person: highlight, show bloodline, rotate the tree to face them */
function selectPerson(pid, force){
  if(!G[pid]) return;
  if(!force && searchHitId === pid){ clearSelection(); return; }   // tap again to release
  searchHitId = pid;
  computeBloodline(pid);
  expandFor(pid);
  relayout(); updateCards(); updateBars();
  focusUnit(unitOf[pid]);
}

/** Drop the highlighted person; fall back to "you" bloodline if one is set */
function clearSelection(){
  searchHitId = null;
  if(youId){ computeBloodline(youId); }
  else { pathSet = new Set(); dimMode = false; bloodId = null; }
  updateCards(); updateBars(); fitView();
}

function updateBars(){
  const bar = document.getElementById('you-bar'); if(!bar) return;
  if(!youId && !bloodId){ bar.style.display = 'none'; bar.innerHTML = ''; return; }
  let html = '';
  if(youId) html += `<div>${t('youBarPre')} <b>${nm(youId)}</b> &nbsp;${t('youBarSuf')}</div>`;
  if(bloodId){
    const chain = chainOf(bloodId);
    html += `<div class="yb-chain"><span style="opacity:.75;font-size:.68rem">${t('bloodline')}:</span>` +
      chain.map((id,i) => (i?'<span class="chip-arrow">›</span>':'') +
        `<span class="chip${i===chain.length-1?' last':''}" onclick="focusPerson('${id}')">${nm(id)}</span>`).join('') + `</div>`;
    html += `<div class="yb-stats">${bloodStats.anc} ${t('ancestors')} · ${bloodStats.desc} ${t('descendants')}</div>`;
  }
  bar.innerHTML = html; bar.style.display = 'block';
}

/* ================================================================
   MODULE: RENDER LOOP (cards + branches)
================================================================ */
const canvas = document.getElementById('edges');
const ctx = canvas.getContext('2d');
let dirty = true, autoRot = true, dragging = false, lastT = performance.now();
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduceMotion) autoRot = false;
function markDirty(){ dirty = true; }

function resize(){
  W = stageEl.clientWidth; H = stageEl.clientHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
  markDirty();
}
if(window.ResizeObserver) new ResizeObserver(resize).observe(stageEl);
window.addEventListener('resize', resize);

function setAuto(on){
  autoRot = on && !reduceMotion;
  const b = document.getElementById('btn-auto'); if(b) b.classList.toggle('on', autoRot);
}

function drawRings(){
  ctx.setLineDash([4, 9]); ctx.lineWidth = 1;
  for(let d = 1; d <= maxD; d++){
    ctx.beginPath();
    for(let i = 0; i <= 72; i++){
      const p = project(d*RSTEP, i/72*TAU, d*YSTEP, cam);
      i ? ctx.lineTo(p.sx, p.sy) : ctx.moveTo(p.sx, p.sy);
    }
    ctx.strokeStyle = 'rgba(212,175,55,0.09)'; ctx.stroke();
  }
  ctx.setLineDash([]);
}

function drawEdges(now){
  const R = Math.max(maxD*RSTEP, 1);
  const hasPath = pathSet.size > 0;
  const flow = hasPath && !reduceMotion;
  Object.values(U).forEach(u => {
    const pu = u.parent; if(!pu || u.alpha < 0.03) return;
    const N = 10, pts = [];
    for(let i = 0; i <= N; i++){
      const tt = i/N, e = tt*tt*(3-2*tt);
      pts.push(project(pu.cur.r + (u.cur.r-pu.cur.r)*tt, pu.cur.th + (u.cur.th-pu.cur.th)*e, pu.cur.y + (u.cur.y-pu.cur.y)*e, cam));
    }
    const mid = pts[N>>1];
    const dn = clamp((mid.z + R)/(2*R), 0, 1);
    const onP = hasPath && pathSet.has(u.id) && pathSet.has(pu.id);
    ctx.beginPath();
    pts.forEach((p,i) => i ? ctx.lineTo(p.sx, p.sy) : ctx.moveTo(p.sx, p.sy));
    if(onP){
      ctx.shadowColor = 'rgba(255,215,0,0.9)'; ctx.shadowBlur = 12;
      ctx.strokeStyle = `rgba(255,215,0,${0.6+0.4*dn})`; ctx.lineWidth = Math.max(2, 3.6*mid.s);
      ctx.stroke(); ctx.shadowBlur = 0;
      if(flow){
        ctx.setLineDash([10, 16]); ctx.lineDashOffset = -(now/35) % 26;
        ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = Math.max(1, 1.4*mid.s); ctx.stroke();
        ctx.setLineDash([]);
      }
    } else {
      let a = (0.2 + 0.5*dn) * u.alpha;
      if(dimMode) a *= 0.14;
      ctx.strokeStyle = `rgba(212,175,55,${a.toFixed(3)})`;
      ctx.lineWidth = Math.max(0.7, 1.6*mid.s); ctx.stroke();
    }
  });
}

function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(50, now - lastT); lastT = now;
  if(autoRot && !dragging) tgt.yaw += dt*0.00011;

  let moving = false;
  const kc = dragging ? 0.4 : 0.13;
  for(const k of ['yaw','pitch','zoom','panX','panY','cy']){
    const d = tgt[k] - cam[k];
    const eps = (k==='panX'||k==='panY'||k==='cy') ? 0.05 : 0.0002;
    if(Math.abs(d) > eps){ cam[k] += d*kc; moving = true; } else if(d !== 0){ cam[k] = tgt[k]; moving = true; }
  }
  Object.values(U).forEach(u => {
    const c = u.cur, tt = u.t;
    const dr = tt.r-c.r, dth = tt.th-c.th, dy = tt.y-c.y;
    if(Math.abs(dr)>0.1 || Math.abs(dth)>0.0005 || Math.abs(dy)>0.1){ c.r += dr*0.11; c.th += dth*0.11; c.y += dy*0.11; moving = true; }
    else { c.r = tt.r; c.th = tt.th; c.y = tt.y; }
    const ta = u.shown ? 1 : 0, da = ta - u.alpha;
    if(Math.abs(da) > 0.004){ u.alpha += da*0.14; moving = true; } else u.alpha = ta;
  });

  const animating = moving || dirty || autoRot || (pathSet.size > 0 && !reduceMotion);
  if(!animating) return;
  dirty = false;

  // ---- cards ----
  const R = Math.max(maxD*RSTEP, 1);
  Object.values(U).forEach(u => {
    const el = u.el;
    if(u.alpha < 0.02){ if(el.style.display !== 'none') el.style.display = 'none'; return; }
    const p = project(u.cur.r, u.cur.th, u.cur.y, cam);
    const dn = clamp((p.z + R)/(2*R), 0, 1);
    let op = 0.34 + 0.66*Math.pow(dn, 0.8);
    if(u.hot) op = Math.max(op, 0.92);
    if(u.dim) op *= 0.2;
    const k = clamp(p.s, 0.26, 2.4);
    el.style.display = 'block';
    el.style.transform = `translate(${p.sx.toFixed(1)}px,${p.sy.toFixed(1)}px) translate(-50%,-50%) scale(${k.toFixed(3)})`;
    el.style.zIndex = Math.round(3000 + p.z);
    el.style.opacity = (op*u.alpha).toFixed(3);
  });

  // ---- branches ----
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  drawRings();
  drawEdges(now);

  const lbl = document.getElementById('zoom-label');
  if(lbl) lbl.textContent = Math.round(cam.zoom*100) + '%';
}

/* ================================================================
   MODULE: INTERACTION — rotate / slide / zoom
================================================================ */
const ptrs = new Map();
let lastPinch = 0, lastMid = null, vel = 0, lastMoveT = 0;

function zoomAt(mx, my, factor){
  const nz = clamp(tgt.zoom*factor, 0.2, 3), r = nz/tgt.zoom;
  const cx = mx - W/2, cy = my - H/2;
  tgt.panX = cx - (cx - tgt.panX)*r; tgt.panY = cy - (cy - tgt.panY)*r;
  tgt.zoom = nz; markDirty();
}

stageEl.addEventListener('pointerdown', e => {
  if(e.pointerType === 'mouse' && e.button !== 0 && e.button !== 2) return;
  ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
  dragDist = 0; vel = 0; dragging = true; setAuto(false);
  stageEl.classList.add('dragging');
  if(ptrs.size === 2){
    const [a,b] = [...ptrs.values()];
    lastPinch = Math.hypot(a.x-b.x, a.y-b.y); lastMid = { x:(a.x+b.x)/2, y:(a.y+b.y)/2 };
  }
});
window.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if(!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  dragDist += Math.abs(dx) + Math.abs(dy);
  if(ptrs.size === 1){
    if(e.shiftKey || (e.buttons & 2)){ tgt.panX += dx; tgt.panY += dy; }
    else { tgt.yaw += dx*0.0075; tgt.panY += dy; vel = dx*0.0075; lastMoveT = performance.now(); }
  } else if(ptrs.size === 2){
    const [a,b] = [...ptrs.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y), mid = { x:(a.x+b.x)/2, y:(a.y+b.y)/2 };
    const rect = stageEl.getBoundingClientRect();
    if(lastPinch) zoomAt(mid.x - rect.left, mid.y - rect.top, d/lastPinch);
    if(lastMid){ tgt.panX += mid.x - lastMid.x; tgt.panY += mid.y - lastMid.y; }
    lastPinch = d; lastMid = mid;
  }
  markDirty();
});
function endPointer(e){
  if(!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if(ptrs.size < 2){ lastPinch = 0; lastMid = null; }
  if(ptrs.size === 0){
    dragging = false; stageEl.classList.remove('dragging');
    if(performance.now() - lastMoveT < 80 && Math.abs(vel) > 0.002) tgt.yaw += vel*4;   // a little momentum
  }
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);
stageEl.addEventListener('contextmenu', e => e.preventDefault());
stageEl.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = stageEl.getBoundingClientRect();
  zoomAt(e.clientX - rect.left, e.clientY - rect.top, e.deltaY > 0 ? 0.9 : 1.1);
  setAuto(false);
}, { passive:false });

document.addEventListener('keydown', e => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if(tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if(document.getElementById('moverlay')) return;
  if(e.key === 'ArrowLeft'){ tgt.yaw -= 0.22; setAuto(false); }
  else if(e.key === 'ArrowRight'){ tgt.yaw += 0.22; setAuto(false); }
  else if(e.key === 'ArrowUp'){ tgt.panY += 50; }
  else if(e.key === 'ArrowDown'){ tgt.panY -= 50; }
  else if(e.key === '+' || e.key === '='){ zoomAt(W/2, H/2, 1.2); }
  else if(e.key === '-'){ zoomAt(W/2, H/2, 1/1.2); }
  else return;
  e.preventDefault(); markDirty();
});

document.getElementById('zoom-in').onclick    = () => zoomAt(W/2, H/2, 1.25);
document.getElementById('zoom-out').onclick   = () => zoomAt(W/2, H/2, 1/1.25);
document.getElementById('zoom-reset').onclick = () => fitView();
document.getElementById('btn-auto').onclick   = () => setAuto(!autoRot);
document.getElementById('btn-tilt').onclick   = () => {
  const steps = [0.05, PITCH0, 0.45, 0.8];
  let i = steps.findIndex(v => Math.abs(v - tgt.pitch) < 0.08);
  tgt.pitch = steps[(i + 1) % steps.length]; markDirty();
};

/* ================================================================
   MODULE: SEARCH
================================================================ */
let searchTimeout = null;
const personMatches = (p, qn, qraw) =>
  p.name.toLowerCase().includes(qn) || normName(TE_NAMES[p.name]).includes(normName(qraw));

function initSearch(){
  const input = document.getElementById('search-input');
  const clearBtn = document.getElementById('search-clear');
  const sugBox = document.getElementById('search-suggestions');

  input.addEventListener('input', () => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => handleSearch(input.value), 200);
  });
  input.addEventListener('keydown', e => {
    if(e.key === 'Escape') clearSearch();
    if(e.key === 'Enter'){
      const q = input.value.trim(); if(!q) return;
      const m = Object.values(G).filter(p => personMatches(p, q.toLowerCase(), q));
      if(m.length){ sugBox.style.display = 'none'; selectPerson(m[0].id, true); }
    }
  });
  clearBtn.addEventListener('click', clearSearch);
  document.addEventListener('click', e => {
    if(!document.getElementById('search-box-wrap').contains(e.target)) sugBox.style.display = 'none';
  });
}

function handleSearch(query){
  const sug = document.getElementById('search-suggestions');
  const q = query.trim();
  if(!q){ clearSearch(); return; }
  const matches = Object.values(G).filter(p => personMatches(p, q.toLowerCase(), q));

  if(matches.length === 0){ sug.style.display = 'none'; return; }
  if(matches.length === 1){ sug.style.display = 'none'; selectPerson(matches[0].id, true); return; }

  sug.innerHTML = matches.slice(0, 12).map(p => {
    const par = p.fatherId && BLOOD.has(p.fatherId) ? p.fatherId : (p.motherId ? p.motherId : (p.fatherId || null));
    const meta = par ? `${t('childOf')} ${nm(par)}` : (p.spouseId ? `${t('Spouse')}: ${nm(p.spouseId)}` : '');
    return `<div class="search-sug-item" onclick="selectSuggestion('${p.id}')">
      <span class="sug-name">${nm(p.id)}</span>${meta ? `<span class="sug-meta">${meta}</span>` : ''}</div>`;
  }).join('');
  sug.style.display = 'block';
}

function selectSuggestion(id){
  document.getElementById('search-suggestions').style.display = 'none';
  document.getElementById('search-input').value = nm(id);
  selectPerson(id, true);
}

function clearSearch(){
  document.getElementById('search-input').value = '';
  document.getElementById('search-suggestions').style.display = 'none';
  if(searchHitId) clearSelection();
}

/* ================================================================
   MODULE: TOOLBAR + ACTIONS
================================================================ */
function renderToolbar(){
  const tb = document.getElementById('toolbar'); if(!tb) return;
  tb.innerHTML = `
    <div class="lang-toggle">
      <button class="lang-opt${lang==='en'?' active':''}" onclick="setLang('en')">EN</button>
      <button class="lang-opt${lang==='te'?' active':''}" onclick="setLang('te')">తె Telugu</button>
    </div>
    <button class="btn btn-primary" onclick="openModal()">${t('btnRelation')}</button>
    <button class="btn" onclick="expandAll()">${t('btnExpand')}</button>
    <button class="btn" onclick="collapseAll()">${t('btnCollapse')}</button>
    ${(youId || bloodId) ? `<button class="btn btn-danger" onclick="clearYou()">${t('btnClear')}</button>` : ''}`;
}

function togNode(id){
  collapsed[id] = !collapsed[id];
  relayout(); updateCards();
}
function expandAll(){ collapsed = {}; relayout(); updateCards(); fitView(); }
function collapseAll(){
  Object.values(U).forEach(u => { if(u.kids.length) collapsed[u.id] = true; });
  relayout(); updateCards(); fitView();
}
function clearYou(){
  youId = null; relMap = {}; pathSet = new Set(); dimMode = false; bloodId = null; searchHitId = null;
  document.getElementById('search-input').value = '';
  renderToolbar(); updateBars(); updateCards(); fitView();
}
function setYou(id){
  youId = id; relMap = buildRelMap(id); searchHitId = null;
  computeBloodline(id); expandFor(id);
  renderToolbar(); updateBars(); relayout(); updateCards();
  focusUnit(unitOf[id]);
}

/* ================================================================
   MODULE: MODAL — Know Your Relationship
================================================================ */
function openModal(){
  const fList = Object.values(G).filter(p => p.childrenIds && p.childrenIds.length)
    .sort((a,b) => nm(a.id).localeCompare(nm(b.id), lang==='te'?'te':'en'));
  const fOpts = fList.map(f => {
    const par = f.fatherId || f.motherId || f.spouseId;
    const hint = par ? ` (${nm(par)})` : '';
    return `<option value="${f.id}">${nm(f.id)}${hint}</option>`;
  }).join('');

  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay" id="moverlay" onclick="mClick(event)">
      <div class="modal">
        <h2>${t('modalTitle')}</h2>
        <p>${t('modalDesc')}</p>
        <div class="fgrp">
          <label>${t('labelName')}</label>
          <input id="inp-name" placeholder="${t('placeholderName')}" onkeydown="if(event.key==='Enter')doFind()"/>
        </div>
        <div class="fgrp">
          <label>${t('labelFather')} <span style="font-size:.6rem;opacity:.55">${t('labelFatherHint')}</span></label>
          <select id="inp-father">
            <option value="">${t('fatherDefault')}</option>
            ${fOpts}
          </select>
        </div>
        <div id="modal-err" class="modal-err"></div>
        <div class="modal-divider"></div>
        <div class="modal-footer">
          <button class="btn" onclick="closeModal()">${t('btnCancel')}</button>
          <button class="btn btn-primary" onclick="doFind()">${t('btnFind')}</button>
        </div>
      </div>
    </div>`;
  setTimeout(() => { const el = document.getElementById('inp-name'); if(el) el.focus(); }, 50);
}
function mClick(e){ if(e.target.id === 'moverlay') closeModal(); }
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }

function doFind(){
  const raw   = document.getElementById('inp-name').value || '';
  const name  = normName(raw);
  const fid   = document.getElementById('inp-father').value;
  const errEl = document.getElementById('modal-err');
  if(!name){ errEl.textContent = t('errNoName'); return; }

  let matches = Object.values(G).filter(p => normName(p.name) === name || normName(TE_NAMES[p.name]) === name);
  if(fid) matches = matches.filter(p => p.fatherId === fid || p.motherId === fid);
  if(matches.length === 0){ errEl.textContent = t('errNotFound'); return; }
  if(matches.length > 1){ errEl.textContent = t('errMultiple'); return; }

  closeModal();
  setYou(matches[0].id);
}

/* ================================================================
   MODULE: TIMELINE
================================================================ */
function buildTimeline(){
  const track = document.getElementById('timeline-track');
  const seg = `<span class="timeline-seg">
    <span class="timeline-gem"></span>
    <span class="timeline-text">${t('timeline')}</span>
    <span class="timeline-gem"></span>
  </span>`;
  track.innerHTML = seg.repeat(6);
}

   BOOT
================================================================ */
buildCards();
applyUIStrings();
initSearch();
renderToolbar();
updateBars();
resize();
relayout();
updateCards();
buildTimeline();
fitView();
cam.cy = tgt.cy;
requestAnimationFrame(frame);
</script>
